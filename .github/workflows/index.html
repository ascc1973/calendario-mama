<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calendario</title>

<style>
body {
  font-family: Arial;
  background: #111;
  color: white;
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
  font-size: 34px;
}

#events {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.event {
  background: #2b2b2b;
  padding: 16px;
  border-radius: 12px;
}

.title {
  font-size: 22px;
  font-weight: bold;
}

.time {
  font-size: 16px;
  color: #bbb;
  margin-top: 5px;
}
</style>
</head>

<body>

<h1>Calendario</h1>

<div id="events"></div>

<script>
async function loadEvents() {
  try {
    const res = await fetch("./events.json?_=" + Date.now());
    const events = await res.json();

    const container = document.getElementById("events");
    container.innerHTML = "";

    events.forEach(ev => {
      const div = document.createElement("div");
      div.className = "event";

      div.innerHTML = `
        <div class="title">${ev.title}</div>
        <div class="time">${formatDate(ev.start)}</div>
      `;

      container.appendChild(div);
    });

  } catch (e) {
    document.getElementById("events").innerHTML =
      "<p>Error cargando eventos</p>";
  }
}

function formatDate(d) {
  if (!d) return "";
  return d.replace("T", " ").substring(0, 16);
}

loadEvents();
setInterval(loadEvents, 60000);
</script>

</body>
</html>

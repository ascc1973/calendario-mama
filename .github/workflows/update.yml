name: Sync Google Calendar

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Download ICS
      run: |
        curl -L "https://calendar.google.com/calendar/embed?src=anacara1941%40gmail.com&ctz=Europe%2FMadrid" -o calendar.ics

    - name: Convert to JSON (robusto)
      run: |
        python3 - <<EOF
import json

try:
    with open("calendar.ics", "r", encoding="utf-8") as f:
        data = f.read().splitlines()
except Exception as e:
    print("ERROR ICS:", e)
    data = []

events = []
event = {}

for line in data:
    line = line.strip()

    if "BEGIN:VEVENT" in line:
        event = {}

    elif line.startswith("SUMMARY:"):
        event["title"] = line.replace("SUMMARY:", "").strip()

    elif "DTSTART" in line:
        event["start"] = line.split(":")[-1].strip()

    elif "DTEND" in line:
        event["end"] = line.split(":")[-1].strip()

    elif "END:VEVENT" in line:
        if event.get("title"):
            events.append(event)

with open("events.json", "w", encoding="utf-8") as f:
    json.dump(events, f, indent=2, ensure_ascii=False)

print("EVENTS GENERADOS:", len(events))
EOF

    - name: Commit & push
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git add events.json
        git commit -m "update events" || echo "sin cambios"
        git push

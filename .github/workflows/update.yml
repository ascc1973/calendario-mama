name: Sync Google Calendar

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download ICS
        run: curl -L "https://calendar.google.com/calendar/ical/anacara1941%40gmail.com/public/basic.ics" -o calendar.ics

      - name: Convert ICS to JSON (Versión Robusta)
        run: |
          echo 'import json, re

lines = open("calendar.ics", encoding="utf-8").read().splitlines()

events = []
event = {}

for line in lines:
    line = line.strip()

    if "BEGIN:VEVENT" in line:
        event = {}
    elif line.startswith("SUMMARY:"):
        # Captura el título del evento
        event["title"] = line.replace("SUMMARY:", "").strip()
    elif line.startswith("DTSTART"):
        # Extrae la fecha ignorando parámetros extras de Google (como TZID)
        match = re.search(r":(\d{8}T\d{6}Z?)", line)
        if match:
            event["start"] = match.group(1)
        else:
            # Caso para eventos de día completo
            event["start"] = line.split(":")[-1].strip()
    elif line.startswith("DTEND"):
        match = re.search(r":(\d{8}T\d{6}Z?)", line)
        if match:
            event["end"] = match.group(1)
        else:
            event["end"] = line.split(":")[-1].strip()
    elif "END:VEVENT" in line:
        if "title" in event and "start" in event:
            events.append(event)

# Ordenar por fecha y hora
events.sort(key=lambda x: x.get("start", ""))

with open("events.json", "w", encoding="utf-8") as f:
    json.dump(events, f, indent=2, ensure_ascii=False)

print(f"Total eventos procesados: {len(events)}")' > script.py

          python3 script.py

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add events.json
          git commit -m "update events" || exit 0
          git push
name: Update Calendar

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Fetch ICS and convert to JSON
      run: |
        curl "https://calendar.google.com/calendar/embed?src=anacara1941%40gmail.com&ctz=Europe%2FMadrid" -o calendar.ics

        python3 - <<EOF
import json

ics = open("calendar.ics").read().splitlines()

events = []
event = {}

for line in ics:
    if "BEGIN:VEVENT" in line:
        event = {}
    if "SUMMARY:" in line:
        event["title"] = line.replace("SUMMARY:", "")
    if "DTSTART" in line:
        event["start"] = line.split(":")[-1]
    if "DTEND" in line:
        event["end"] = line.split(":")[-1]
    if "END:VEVENT" in line:
        if "title" in event:
            events.append(event)

with open("events.json", "w") as f:
    json.dump(events, f)
EOF

    - name: Commit results
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git add events.json
        git commit -m "update calendar" || exit 0
        git push
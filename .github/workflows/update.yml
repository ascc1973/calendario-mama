name: Sync Google Calendar

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download ICS
        run: curl -L "https://calendar.google.com/calendar/ical/anacara1941%40gmail.com/public/basic.ics" -o calendar.ics

      - name: Convert ICS to JSON
        run: |
          python3 - << 'EOF'
          import json

          def parse_ics(file):
              events = []
              event = {}

              with open(file, encoding="utf-8") as f:
                  for line in f:
                      line = line.strip()

                      if line == "BEGIN:VEVENT":
                          event = {}

                      elif line.startswith("SUMMARY:"):
                          event["title"] = line.replace("SUMMARY:", "")

                      elif line.startswith("DTSTART"):
                          event["start"] = line.split(":")[-1]

                      elif line.startswith("DTEND"):
                          event["end"] = line.split(":")[-1]

                      elif line == "END:VEVENT":
                          if "title" in event:
                              events.append(event)

              return events

          events = parse_ics("calendar.ics")

          with open("events.json", "w", encoding="utf-8") as f:
              json.dump(events, f, indent=2, ensure_ascii=False)

          print("EVENTOS GENERADOS:", len(events))
          EOF

      - name: Commit & Push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add events.json
          git commit -m "update events" || echo "no changes"
          git push

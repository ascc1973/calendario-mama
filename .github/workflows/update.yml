name: Sync Google Calendar

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download ICS
        run: curl -L "https://calendar.google.com/calendar/embed?src=anacara1941%40gmail.com&ctz=Europe%2FMadrid" -o calendar.ics

      - name: Convert ICS to JSON (safe script file)
        run: |
          echo 'import json

lines = open("calendar.ics", encoding="utf-8").read().splitlines()

events = []
event = {}

for line in lines:
    line = line.strip()

    if "BEGIN:VEVENT" in line:
        event = {}

    elif line.startswith("SUMMARY:"):
        event["title"] = line.replace("SUMMARY:", "").strip()

    elif "DTSTART" in line:
        event["start"] = line.split(":")[-1].strip()

    elif "DTEND" in line:
        event["end"] = line.split(":")[-1].strip()

    elif "END:VEVENT" in line:
        if "title" in event:
            events.append(event)

with open("events.json", "w", encoding="utf-8") as f:
    json.dump(events, f, indent=2, ensure_ascii=False)

print("EVENTOS:", len(events))' > script.py

          python3 script.py

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add events.json
          git commit -m "update events" || exit 0
          git push
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calendario para Mamá</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; overflow: hidden; 
            background-color: #000; font-family: 'Arial Black', sans-serif; 
        }

        /* PANTALLA INICIAL ROJA */
        #pantalla-inicio {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: red; color: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 300; text-align: center;
        }

        /* CABECERA */
        #barra {
            height: 15vh; background: black; color: white;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #reloj { font-size: 5rem; font-weight: bold; }
        #fecha { font-size: 2rem; text-transform: uppercase; }

        /* COLUMNAS */
        .container { display: flex; height: 85vh; width: 100%; }
        .columna { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 15px; }
        .hoy { background-color: #f1d933; color: black; }
        .manana { background-color: #1a237e; color: white; }

        .btn-escuchar {
            background: white; border: 4px solid black; padding: 15px;
            font-size: 1.5rem; border-radius: 15px; margin-bottom: 20px; font-weight: bold; cursor: pointer;
        }

        .lista-tareas { width: 100%; overflow-y: auto; text-align: center; }
        .evento {
            background: white; margin: 15px; padding: 25px;
            border-radius: 20px; border: 8px solid transparent; font-size: 2.3rem; color: black;
        }

        /* PARPADEO */
        .urgente {
            border-color: red !important;
            -webkit-animation: parpadeo 0.8s infinite;
            animation: parpadeo 0.8s infinite;
        }
        @-webkit-keyframes parpadeo { 0% { background: #fff; } 50% { background: #ffb3b3; } 100% { background: #fff; } }
        @keyframes parpadeo { 0% { background: #fff; } 50% { background: #ffb3b3; } 100% { background: #fff; } }

        /* PANTALLA ALARMA */
        #pantalla-alarma {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ff0000; color: white; display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 200; text-align: center;
        }
    </style>
</head>
<body>

    <div id="pantalla-inicio" onclick="iniciarSistema()">
        <h1 style="font-size: 5rem;">TOCAR AQUÍ PARA EMPEZAR</h1>
    </div>

    <div id="pantalla-alarma" onclick="detenerAlarma()">
        <h1 id="alarma-texto" style="font-size: 4rem;">AVISO</h1>
        <button class="btn-escuchar" style="font-size: 3rem; padding: 40px; margin-top: 30px;">PARAR ALARMA</button>
    </div>

    <div id="barra">
        <div id="reloj">00:00</div>
        <div id="fecha">...</div>
    </div>

    <div class="container">
        <div class="columna hoy">
            <h1 style="font-size: 3rem; margin-bottom: 10px;">HOY</h1>
            <button class="btn-escuchar" onclick="leer('lista-hoy')">🔊 ESCUCHAR HOY</button>
            <div id="lista-hoy" class="lista-tareas">Cargando tareas...</div>
        </div>
        <div class="columna manana">
            <h1 style="font-size: 3rem; margin-bottom: 10px;">MAÑANA</h1>
            <button class="btn-escuchar" onclick="leer('lista-manana')">🔊 ESCUCHAR MAÑANA</button>
            <div id="lista-manana" class="lista-tareas">Cargando tareas...</div>
        </div>
    </div>

    <audio id="campana" src="https://raw.githubusercontent.com/ascc1973/calendario-mama/main/campana.mp3" loop></audio>

    <script>
        // URL corregida con "s" y parámetros para evitar el error de conexión
        const urlJSON = "https://raw.githubusercontent.com/ascc1973/calendario-mama/main/events.json";
        let eventosGlobales = [];

        async function cargar() {
            try {
                // El cache: 'no-store' obliga a la tablet a descargar el archivo nuevo
                const res = await fetch(urlJSON, { cache: 'no-store' });
                if (!res.ok) throw new Error();
                const datos = await res.json();
                eventosGlobales = datos;
                
                const hoyF = new Date().toISOString().split('T')[0];
                const mañana = new Date(); mañana.setDate(mañana.getDate() + 1);
                const mananaF = mañana.toISOString().split('T')[0];

                render(datos.filter(e => e.fecha === hoyF), 'lista-hoy');
                render(datos.filter(e => e.fecha === mananaF), 'lista-manana');
            } catch (e) {
                document.getElementById('lista-hoy').innerHTML = "Reintentando conexión...";
                setTimeout(cargar, 5000); // Si falla, lo intenta de nuevo en 5 segundos
            }
        }

        function render(lista, id) {
            const cont = document.getElementById(id);
            if (lista.length === 0) { cont.innerHTML = "<h2>No hay tareas</h2>"; return; }
            const ahora = new Date();
            cont.innerHTML = lista.map(e => {
                const [h, m] = e.hora.split(':');
                const fechaEv = new Date();
                fechaEv.setHours(parseInt(h), parseInt(m), 0);
                const diffMin = (fechaEv - ahora) / 60000;
                const asteriscos = (e.tarea.match(/\*/g) || []).length;
                let urgente = (asteriscos >= 2 && diffMin <= 125 && diffMin > -60) ? 'urgente' : '';
                return `<div class="evento ${urgente}"><b>${e.hora}</b><br>${e.tarea.replace(/\*/g, '')}</div>`;
            }).join('');
        }

        function iniciarSistema() {
            document.getElementById('pantalla-inicio').style.display = 'none';
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            actualizarReloj();
            cargar();
            setInterval(actualizarReloj, 1000);
            setInterval(cargar, 60000); // Recarga cada minuto
            window.speechSynthesis.speak(new SpeechSynthesisUtterance("Calendario encendido"));
        }

        function actualizarReloj() {
            const n = new Date();
            document.getElementById('fecha').innerText = n.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
            document.getElementById('reloj').innerText = n.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
        }

        function leer(id) {
            const t = document.getElementById(id).innerText;
            const u = new SpeechSynthesisUtterance(t.includes("No hay tareas") ? "No hay nada pendiente" : "Tienes: " + t);
            u.lang = 'es-ES';
            window.speechSynthesis.speak(u);
        }

        function detenerAlarma() {
            document.getElementById('pantalla-alarma').style.display = 'none';
            document.getElementById('campana').pause();
            window.speechSynthesis.cancel();
        }
    </script>
</body>
</html>

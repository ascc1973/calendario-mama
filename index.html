<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario Mamá FINAL</title>

<style>
body,html{
  margin:0;
  padding:0;
  height:100%;
  font-family:Arial Black;
  background:#000;
  color:#fff;
}

#btn{
  position:fixed;
  width:100%;
  height:100%;
  background:red;
  color:white;
  font-size:5vh;
  border:none;
  z-index:9999;
}

.container{
  display:none;
  height:100vh;
  display:flex;
  padding-top:60px;
}

.col{
  width:50%;
  padding:10px;
  overflow-y:auto;
  box-sizing:border-box;
}

.col-hoy{background:#ffeb3b;color:#000;}
.col-manana{background:#1a237e;color:#fff;}

.evento{
  background:#fff;
  color:#000;
  margin-bottom:10px;
  padding:10px;
  border-radius:10px;
}

.evento h2{
  margin:0;
  color:red;
}

#debug{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#111;
  color:#0f0;
  font-size:12px;
  padding:5px;
}
</style>
</head>

<body>

<button id="btn" onclick="start()">PULSA PARA INICIAR</button>

<div class="container">
  <div class="col col-hoy">
    <h2>HOY</h2>
    <div id="hoy"></div>
  </div>

  <div class="col col-manana">
    <h2>MAÑANA</h2>
    <div id="manana"></div>
  </div>
</div>

<div id="debug">esperando datos...</div>

<script>

let hoy=[];
let manana=[];

/* ========================= */
function start(){
  document.getElementById("btn").style.display="none";
  document.querySelector(".container").style.display="flex";

  load();
  setInterval(load,60000);
}

/* ========================= */
async function load(){

  try{

    const r = await fetch("events.json?t="+Date.now());
    const data = await r.json();

    console.log("RAW DATA:", data);

    if(!Array.isArray(data)){
      document.getElementById("debug").innerText="ERROR: JSON no es array";
      return;
    }

    process(data);
    render();

  }catch(e){
    document.getElementById("debug").innerText="ERROR FETCH JSON";
    console.log(e);
  }
}

/* =========================
   🔥 PARSER UNIVERSAL (ESTO ES LA CLAVE)
========================= */
function process(items){

  hoy=[];
  manana=[];

  const today=new Date();
  today.setHours(0,0,0,0);

  const tomorrow=new Date(today);
  tomorrow.setDate(tomorrow.getDate()+1);

  items.forEach(e=>{

    console.log("EVENTO RAW:", e);

    // 🔥 MULTI-FORMATO REAL
    let raw =
      e.start?.dateTime ||
      e.start ||
      e.date ||
      e.startDate ||
      e.time ||
      e.hora;

    if(!raw){
      console.log("SIN FECHA:", e);
      return;
    }

    const f = new Date(raw);

    if(isNaN(f.getTime())){
      console.log("FECHA INVALIDA:", raw);
      return;
    }

    const ev = {
      title:
        e.summary ||
        e.title ||
        e.nombre ||
        "Sin título",

      time: f,

      text:
        "a las " +
        (f.getHours()%12||12) + ":" +
        String(f.getMinutes()).padStart(2,"0")
    };

    const d=new Date(f);
    d.setHours(0,0,0,0);

    if(d.getTime()===today.getTime()) hoy.push(ev);
    if(d.getTime()===tomorrow.getTime()) manana.push(ev);
  });

  document.getElementById("debug").innerText=
    "HOY: " + hoy.length + " | MAÑANA: " + manana.length;
}

/* ========================= */
function render(){
  draw(hoy,"hoy");
  draw(manana,"manana");
}

/* ========================= */
function draw(list,id){

  const c=document.getElementById(id);
  c.innerHTML="";

  if(list.length===0){
    c.innerHTML="<p>No hay eventos</p>";
    return;
  }

  list.forEach(ev=>{

    const div=document.createElement("div");
    div.className="evento";

    div.innerHTML=
      `<h2>${ev.text}</h2>
       <p>${ev.title}</p>`;

    div.onclick=()=>{

      const audio = new Audio(
        "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=es&q=" +
        encodeURIComponent("Mamá, " + ev.text + " tienes " + ev.title)
      );

      audio.play().catch(e=>{
        console.log("audio bloqueado",e);
      });
    };

    c.appendChild(div);
  });
}

</script>

</body>
</html>

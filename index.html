<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario para Mamá</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            overflow: hidden;
            background-color: black;
        }

        #barra {
            background-color: black;
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 2.5vw;
            font-weight: bold;
        }

        .container {
            display: flex;
            height: calc(100% - 60px);
        }

        .columna {
            flex: 1;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
        }

        #hoy { background-color: #ffff00; color: black; }
        #manana { background-color: #1a237e; color: white; }

        h1 { font-size: 3vw; margin-bottom: 10px; text-transform: uppercase; }

        .lista-eventos {
            font-size: 3.5vw;
            font-weight: bold;
            list-style: none;
            padding: 0;
            margin-top: 20px;
            text-align: left;
        }

        .evento {
            background: rgba(255, 255, 255, 0.2);
            margin: 10px 0;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid currentColor;
        }

        /* NUEVO: PANTALLA DE ALARMA FULLSCREEN */
        #pantalla-alarma {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ff0000; /* Rojo para máxima alerta */
            color: white;
            z-index: 9999;
            text-align: center;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            cursor: pointer;
        }

        #texto-alarma {
            font-size: 8vw;
            font-weight: bold;
            text-transform: uppercase;
        }

        .instruccion-tocar {
            font-size: 3vw;
            margin-top: 50px;
            background: white;
            color: black;
            padding: 10px 20px;
            border-radius: 50px;
            animation: parpadeo 1s infinite;
        }

        @keyframes parpadeo {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body onclick="iniciarSistema()">

    <div id="barra">
        <div id="fecha"></div>
        <div id="reloj" style="font-size: 5vw;">00:00</div>
    </div>

    <!-- PANTALLA DE ALARMA (OCULTA POR DEFECTO) -->
    <div id="pantalla-alarma" onclick="detenerAlarma()">
        <div id="texto-alarma"></div>
        <div class="instruccion-tocar">TOCA LA PANTALLA PARA PARAR</div>
    </div>

    <div class="container">
        <div id="hoy" class="columna">
            <h1>HOY</h1>
            <div id="lista-hoy" class="lista-eventos"></div>
        </div>
        <div id="manana" class="columna">
            <h1>MAÑANA</h1>
            <div id="lista-manana" class="lista-eventos"></div>
        </div>
    </div>

    <audio id="campana" src="campana.mp3" loop></audio>

    <script>
        const API_KEY = "AIzaSyDh0DjFE2qqaBeVfww5u84FLp4_elsF7Uc"; // Tu API Key
        const CALENDAR_ID = "anacara1941@gmail.com"; // El correo de tu madre actualizado
        
        let eventosHoy = [];
        let alarmaActiva = false;
        let intervaloAlarma;
        let sistemaIniciado = false;

        // Necesario para que el navegador permita sonidos
        function iniciarSistema() {
            if (!sistemaIniciado) {
                sistemaIniciado = true;
                console.log("Sistema de sonido activado");
                cargarCalendario();
            }
        }

        function actualizarReloj() {
            const ahora = new Date();
            const opcionesFecha = { weekday: 'long', day: 'numeric', month: 'long' };
            document.getElementById('fecha').innerText = ahora.toLocaleDateString('es-ES', opcionesFecha).toUpperCase();
            
            const horas = String(ahora.getHours()).padStart(2, '0');
            const minutos = String(ahora.getMinutes()).padStart(2, '0');
            const horaActual = `${horas}:${minutos}`;
            document.getElementById('reloj').innerText = horaActual;

            // Comprobar si hay un evento justo ahora
            verificarEventos(horaActual);
        }

        function verificarEventos(horaActual) {
            if (alarmaActiva) return; // Si ya hay una alarma sonando, no lanzar otra

            eventosHoy.forEach(evento => {
                if (evento.hora === horaActual) {
                    activarAlarma(evento.titulo);
                }
            });
        }

        function activarAlarma(titulo) {
            alarmaActiva = true;
            const pantalla = document.getElementById('pantalla-alarma');
            const texto = document.getElementById('texto-alarma');
            const sonido = document.getElementById('campana');

            texto.innerText = titulo;
            pantalla.style.display = 'flex';
            
            sonido.play();

            // Bucle de voz cada 8 segundos
            const hablar = () => {
                if (!alarmaActiva) return;
                const mensaje = new SpeechSynthesisUtterance("Mamá, recuerda: " + titulo);
                mensaje.lang = 'es-ES';
                window.speechSynthesis.speak(mensaje);
            };

            hablar();
            intervaloAlarma = setInterval(hablar, 8000);
        }

        function detenerAlarma() {
            alarmaActiva = false;
            clearInterval(intervaloAlarma);
            window.speechSynthesis.cancel();
            
            const sonido = document.getElementById('campana');
            sonido.pause();
            sonido.currentTime = 0;
            
            document.getElementById('pantalla-alarma').style.display = 'none';
        }

       async function cargarCalendario() {
    const ahora = new Date();
    const inicioHoy = new Date(ahora.setHours(0,0,0,0)).toISOString();
    const finManana = new Date(ahora.setDate(ahora.getDate() + 2)).toISOString();

    // ESTA LÍNEA ES LA QUE DEBES CAMBIAR:
    const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events?key=${API_KEY}&timeMin=${inicioHoy}&timeMax=${finManana}&singleEvents=true&orderBy=startTime`;

    try {
        const response = await fetch(url);
        if (!response.ok) {
            console.error("Error en la respuesta de Google:", response.status);
            return;
        }
        const data = await response.json();
        if (data.items) {
            procesarEventos(data.items);
        }
    } catch (error) {
        console.error("Error cargando calendario:", error);
    }
}
        function procesarEventos(items) {
            const hoyStr = new Date().toISOString().split('T')[0];
            const listaHoy = document.getElementById('lista-hoy');
            const listaManana = document.getElementById('lista-manana');
            
            listaHoy.innerHTML = "";
            listaManana.innerHTML = "";
            eventosHoy = [];

            items.forEach(item => {
                const inicio = item.start.dateTime || item.start.date;
                const fechaEvento = inicio.split('T')[0];
                const horaEvento = item.start.dateTime ? inicio.split('T')[1].substring(0,5) : "Todo el día";
                const titulo = item.summary;

                const div = document.createElement('div');
                div.className = 'evento';
                div.innerHTML = `<span>${horaEvento}</span> - ${titulo}`;

                if (fechaEvento === hoyStr) {
                    listaHoy.appendChild(div);
                    if (horaEvento !== "Todo el día") {
                        eventosHoy.push({ hora: horaEvento, titulo: titulo });
                    }
                } else {
                    listaManana.appendChild(div);
                }
            });
        }

        setInterval(actualizarReloj, 1000);
        setInterval(cargarCalendario, 60000); // Actualiza la lista cada minuto
        actualizarReloj();
    </script>
</body>
</html>

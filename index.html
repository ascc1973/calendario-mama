<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario Mamá FIX</title>

<style>
body,html{
  margin:0;
  padding:0;
  height:100%;
  font-family:Arial Black;
  background:#000;
  color:#fff;
}

#btn{
  position:fixed;
  width:100%;
  height:100%;
  background:red;
  color:white;
  font-size:4vh;
  border:none;
}

.container{
  display:none;
  height:100vh;
  display:flex;
  padding-top:60px;
}

.col{
  width:50%;
  padding:10px;
  overflow-y:auto;
}

.col-hoy{background:#ffeb3b;color:#000;}
.col-manana{background:#1a237e;color:#fff;}

.evento{
  background:#fff;
  color:#000;
  margin-bottom:10px;
  padding:10px;
  border-radius:10px;
}

.evento h2{
  margin:0;
  color:red;
}

#debug{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#111;
  font-size:12px;
  padding:5px;
  color:#0f0;
}
</style>
</head>

<body>

<button id="btn" onclick="start()">PULSA PARA INICIAR</button>

<div class="container">
  <div class="col col-hoy">
    <h2>HOY</h2>
    <div id="hoy"></div>
  </div>

  <div class="col col-manana">
    <h2>MAÑANA</h2>
    <div id="manana"></div>
  </div>
</div>

<div id="debug">esperando...</div>

<script>

let hoy=[], manana=[];

/* ========================= */
function start(){
  document.getElementById("btn").style.display="none";
  document.querySelector(".container").style.display="flex";
  load();
  setInterval(load,60000);
}

/* ========================= */
async function load(){

  try{

    const r = await fetch("events.json?t="+Date.now());
    const d = await r.json();

    console.log("JSON REAL:", d);

    if(!Array.isArray(d)){
      document.getElementById("debug").innerText="ERROR: JSON no es array";
      return;
    }

    process(d);
    render();

  }catch(e){
    document.getElementById("debug").innerText="ERROR FETCH";
    console.log(e);
  }
}

/* ========================= */
function process(items){

  hoy=[];
  manana=[];

  const today=new Date();
  today.setHours(0,0,0,0);

  const tomorrow=new Date(today);
  tomorrow.setDate(tomorrow.getDate()+1);

  items.forEach(e=>{

    // 🔥 NO asumimos estructura
    console.log("EVENTO:", e);

    let fecha =
      e.start?.dateTime ||
      e.start ||
      e.fecha ||
      e.date ||
      e.time;

    if(!fecha){
      console.log("sin fecha:", e);
      return;
    }

    const f=new Date(fecha);

    if(isNaN(f.getTime())){
      console.log("fecha inválida:", fecha);
      return;
    }

    const ev={
      title: e.title || e.summary || e.nombre || "Sin título",
      time: f,
      text: "a las " +
        (f.getHours()%12||12) + ":" +
        String(f.getMinutes()).padStart(2,"0")
    };

    const d=new Date(f);
    d.setHours(0,0,0,0);

    if(d.getTime()===today.getTime()) hoy.push(ev);
    if(d.getTime()===tomorrow.getTime()) manana.push(ev);
  });

  document.getElementById("debug").innerText=
    "HOY: " + hoy.length + " | MAÑANA: " + manana.length;
}

/* ========================= */
function render(){
  draw(hoy,"hoy");
  draw(manana,"manana");
}

/* ========================= */
function draw(list,id){

  const c=document.getElementById(id);
  c.innerHTML="";

  list.forEach(ev=>{

    const div=document.createElement("div");
    div.className="evento";

    div.innerHTML=`<h2>${ev.text}</h2><p>${ev.title}</p>`;

    div.onclick=()=>{
      const audio = new Audio(
        "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=es&q=" +
        encodeURIComponent("Mamá, " + ev.text + " tienes " + ev.title)
      );
      audio.play().catch(()=>{});
    };

    c.appendChild(div);
  });
}

</script>

</body>
</html>

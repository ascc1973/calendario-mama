<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario para Mamá</title>
<style>
:root{ --hoy-bg:#FFEB3B; --manana-bg:#1A237E; }
body,html{ margin:0; padding:0; height:100%; font-family:'Arial Black',sans-serif; background:#000; overflow:hidden; touch-action: manipulation; }
#barra{ position:fixed; top:0; left:0; width:100%; background:#000; color:#fff; text-align:center; z-index:1000; }
#fecha{font-size:2vh;}
#reloj{font-size:4vh;}
#btn-inicial{ position:fixed; width:100vw; height:100vh; background:#ff0000; color:white; font-size:5vh; border:none; z-index:99999; cursor:pointer; }
.container{ display:none; height:100vh; padding-top:70px; box-sizing:border-box; display:flex; }
.col{ width:50%; padding:10px; display:flex; flex-direction:column; box-sizing:border-box; }
.col-hoy{ background:var(--hoy-bg); border-right:3px solid #000; }
.col-manana{ background:var(--manana-bg); }
h1{ font-size:2.2vh; margin:2px 0 10px 0; text-align:center; color:#fff; }
.btn-repaso{ width: 100%; padding: 15px; font-size: 1.8vh; border-radius: 10px; border: 3px solid #000; background: #fff; margin-bottom: 15px; cursor: pointer; font-weight: bold; box-sizing: border-box; }
.lista-eventos{ flex-grow:1; display:flex; flex-direction:column; gap:8px; overflow-y: auto; }
.evento{ background:#fff; border-radius:10px; border:3px solid #333; padding:10px; cursor:pointer; color:#000; width: 100%; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
.evento h2{ margin:0; color:#d32f2f; font-size:2.5vh; display: flex; gap: 10px; align-items: baseline; white-space: nowrap; }
.evento p{ margin:5px 0 0; font-size:2.8vh; font-weight:bold; line-height: 1.2; color: #000; }
.urgente{ border:8px solid red !important; animation:blink 0.8s linear infinite; }
@keyframes blink{ 0%{background:#00ff00;border-color:red;} 50%{background:#ffffff;border-color:#ffffff;} 100%{background:#00ff00;border-color:red;} }
#pantalla-evento-activo { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #ff0000; color: white; z-index: 100000; text-align: center; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; }
#hora-evento-gigante { font-size: 8vh; color: #fff; margin: 0; line-height: 1; }
#texto-evento-gigante { font-size: 10vh; margin: 10px 20px 30px 20px; color: #fff; text-transform: uppercase; }
.instruccion { font-size: 3.5vh; background: #fff; color: #000; padding: 15px 40px; border-radius: 50px; animation: flash 1s infinite; font-weight: bold; }
@keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
</style>
</head>
<body>

<button id="btn-inicial" onclick="iniciarSistema()">PULSA PARA ACTIVAR</button>

<div id="barra">
    <div id="fecha"></div>
    <div id="reloj"></div>
</div>

<div id="pantalla-evento-activo" onclick="detenerAlarmaDirecto()">
    <div id="hora-evento-gigante"></div>
    <div id="texto-evento-gigante"></div>
    <div class="instruccion">TOCA AQUÍ PARA PARAR</div>
</div>

<div class="container" id="main-container">
    <div class="col col-hoy">
        <h1>HOY</h1>
        <button class="btn-repaso" onclick="repasarDia('hoy')">🔊 TODO HOY</button>
        <div id="lista-hoy" class="lista-eventos"></div>
    </div>
    <div class="col col-manana">
        <h1>MAÑANA</h1>
        <button class="btn-repaso" onclick="repasarDia('manana')">🔊 TODO MAÑANA</button>
        <div id="lista-manana" class="lista-eventos"></div>
    </div>
</div>

<audio id="campana" src="campana.mp3"></audio>

<script>
var API_KEY="AIzaSyDh0DjfE2qqaBeVfww5u84FLp4_elsF7Uc";
var CALENDAR_ID="anacara1941@gmail.com";

var eventosHoy=[];
var eventosManana=[];
var idEventoActual = null;
var eventosSilenciados = new Set();
var avisosPrevios = new Set();
var vozSeleccionada = null;

function cargarVoces() {
    var voces = window.speechSynthesis.getVoices();
    for(var i=0; i<voces.length; i++) {
        if(voces[i].lang.indexOf("es") !== -1) {
            vozSeleccionada = voces[i];
            break;
        }
    }
}
window.speechSynthesis.onvoiceschanged = cargarVoces;

function numeroALetras(n) {
    var unidades = ['doce', 'una', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez', 'once'];
    return unidades[n % 12];
}

function obtenerFranjaHoraria(h) {
    if (h >= 7 && h < 13) return "de la mañana";
    if (h >= 14 && h <= 20) return "de la tarde";
    if (h >= 21 || h === 0) return "de la noche";
    return "de la madrugada";
}

function actualizarReloj(){
    var ahora = new Date();
    document.getElementById("fecha").innerText = ahora.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}).toUpperCase();
    var h = ahora.getHours(); 
    var m = ahora.getMinutes();
    var hMostrar = h % 12 || 12;
    document.getElementById("reloj").innerText = hMostrar + ":" + (m < 10 ? "0" + m : m);
    render(); 
}

function iniciarSistema(){
    document.getElementById("btn-inicial").style.display="none";
    document.getElementById("main-container").style.display="flex";
    cargarVoces();
    cargarCalendario();
    setInterval(actualizarReloj, 5000);
    setInterval(cargarCalendario, 60000);
    setInterval(verificarAlertas, 10000);
}

function cargarCalendario(){
    var min = new Date(); min.setHours(0,0,0,0);
    var url = "https://www.googleapis.com/calendar/v3/calendars/" + encodeURIComponent(CALENDAR_ID) + "/events?key=" + API_KEY + "&timeMin=" + min.toISOString() + "&singleEvents=true&orderBy=startTime&t=" + Date.now();
    
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState == 4 && xhr.status == 200) {
            var d = JSON.parse(xhr.responseText);
            if(d.items) { organizarEventos(d.items); render(); }
        }
    };
    xhr.send();
}

function organizarEventos(items){
    var hoyStr = new Date().toLocaleDateString();
    var manana = new Date(); manana.setDate(manana.getDate()+1);
    var mananaStr = manana.toLocaleDateString();
    eventosHoy=[]; eventosManana=[];
    
    for(var i=0; i<items.length; i++){
        var item = items[i];
        var inicio = new Date(item.start.dateTime || item.start.date);
        var h = inicio.getHours();
        var m = inicio.getMinutes();
        var periodo = obtenerFranjaHoraria(h);
        
        var ev = {
            id: item.id + inicio.getTime(),
            titulo: (item.summary || "Sin título").replace(/^\*+/,'').trim(),
            hora: inicio,
            franja: periodo,
            textoVoz: "a las " + numeroALetras(h) + " " + (m === 0 ? "en punto" : "y " + m) + " " + periodo,
            horaPantalla: (h % 12 || 12) + ":" + (m < 10 ? "0" + m : m),
            asteriscos: (item.summary || "").split('*').length - 1
        };
        if(inicio.toLocaleDateString() === hoyStr) eventosHoy.push(ev);
        else if(inicio.toLocaleDateString() === mananaStr) eventosManana.push(ev);
    }
}

function render(){
    renderLista(eventosHoy, "lista-hoy");
    renderLista(eventosManana, "lista-manana");
}

function renderLista(lista, idCont){
    var cont = document.getElementById(idCont);
    if(!cont) return;
    cont.innerHTML = "";
    var ahora = new Date();
    
    for(var i=0; i<lista.length; i++){
        (function(ev){
            var yaSilenciado = eventosSilenciados.has(ev.id);
            var diffMin = (ev.hora - ahora) / 60000;
            var urgente = !yaSilenciado && ((ahora >= ev.hora && ahora <= (ev.hora.getTime() + 3600000)) || (ev.asteriscos >= 2 && diffMin <= 120 && diffMin > 0));
            
            var div = document.createElement("div");
            div.className = "evento" + (urgente ? " urgente" : "");
            div.innerHTML = "<h2>" + ev.horaPantalla + " " + ev.franja + "</h2><p>" + ev.titulo + "</p>";
            
            div.onclick = function(e) {
                e.preventDefault();
                hablarDirecto("Mamá, " + ev.textoVoz + " tienes " + ev.titulo);
            };

            cont.appendChild(div);
            if (idCont === "lista-hoy" && ahora >= ev.hora && ahora <= (ev.hora.getTime() + 600000)) {
                if (!yaSilenciado && idEventoActual !== ev.id) lanzarPantallaGigante(ev);
            }
        })(lista[i]);
    }
}

function lanzarPantallaGigante(ev) {
    idEventoActual = ev.id;
    document.getElementById("hora-evento-gigante").innerText = ev.horaPantalla + " " + ev.franja;
    document.getElementById("texto-evento-gigante").innerText = ev.titulo;
    document.getElementById("pantalla-evento-activo").style.display = "flex";
    var campana = document.getElementById("campana");
    campana.play();
    ejecutarVozInfinita(ev);
}

function ejecutarVozInfinita(ev) {
    if (idEventoActual !== ev.id) return;
    window.speechSynthesis.cancel();
    var msg = new SpeechSynthesisUtterance("Mamá, " + ev.textoVoz + " tienes " + ev.titulo);
    if(vozSeleccionada) msg.voice = vozSeleccionada;
    msg.onend = function() { if (idEventoActual === ev.id) setTimeout(function(){ ejecutarVozInfinita(ev); }, 3000); };
    window.speechSynthesis.speak(msg);
}

function detenerAlarmaDirecto() {
    if(idEventoActual) {
        eventosSilenciados.add(idEventoActual);
        idEventoActual = null;
        document.getElementById("pantalla-evento-activo").style.display = "none";
        document.getElementById("campana").pause();
        window.speechSynthesis.cancel();
        render(); 
    }
}

function hablarDirecto(texto) {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(texto);
    if(vozSeleccionada) u.voice = vozSeleccionada;
    window.speechSynthesis.speak(u);
}

function verificarAlertas(){
    var ahora = new Date();
    var todos = eventosHoy.concat(eventosManana);
    for(var i=0; i<todos.length; i++){
        var ev = todos[i];
        var min = Math.floor((ev.hora - ahora) / 60000);
        if((ev.asteriscos === 3 && min === 180) || (ev.asteriscos >= 2 && min === 120) || (ev.asteriscos >= 1 && min === 60)) {
            if(!avisosPrevios.has(ev.id + "_" + min)) {
                avisosPrevios.add(ev.id + "_" + min);
                hablarDirecto("Recordatorio: " + ev.textoVoz + " tienes " + ev.titulo);
            }
        }
    }
}

function repasarDia(dia){
    var lista = dia === "hoy" ? eventosHoy : eventosManana;
    if(lista.length === 0) { hablarDirecto("No hay nada anotado"); return; }
    var t = (dia === "hoy" ? "Mamá, para hoy tienes: " : "Para mañana tienes: ");
    for(var i=0; i<lista.length; i++) { t += lista[i].textoVoz + ", " + lista[i].titulo + ". "; }
    hablarDirecto(t);
}
</script>
</body>
</html>

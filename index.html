<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario para Mamá</title>

<style>
:root{ --hoy-bg:#FFEB3B; --manana-bg:#1A237E; }
body,html{ margin:0; padding:0; height:100%; font-family:'Arial Black',sans-serif; background:#000; overflow:hidden; touch-action: manipulation; }

#barra{ position:fixed; top:0; left:0; width:100%; background:#000; color:#fff; text-align:center; z-index:1000; }
#fecha{font-size:2vh;}
#reloj{font-size:4vh;}

#btn-inicial{ position:fixed; width:100vw; height:100vh; background:#ff0000; color:white; font-size:5vh; border:none; z-index:99999; cursor:pointer; }

.container{ display:none; height:100vh; padding-top:70px; box-sizing:border-box; display:flex; }
.col{ width:50%; padding:10px; display:flex; flex-direction:column; box-sizing:border-box; }
.col-hoy{ background:var(--hoy-bg); border-right:3px solid #000; }
.col-manana{ background:var(--manana-bg); }

h1{ font-size:2.2vh; margin:2px 0 10px 0; text-align:center; color:#fff; }

.btn-repaso{ 
    width: 100%; 
    padding: 15px; 
    font-size: 1.8vh; 
    border-radius: 10px; 
    border: 3px solid #000; 
    background: #fff; 
    margin-bottom: 15px; 
    cursor: pointer; 
    font-weight: bold;
}

.lista-eventos{ flex-grow:1; display:flex; flex-direction:column; gap:8px; overflow-y:auto; }

.evento{ background:#fff; border-radius:10px; border:3px solid #333; padding:10px; cursor:pointer; }

.evento h2{ margin:0; color:#d32f2f; font-size:2.5vh; display:flex; gap:10px; white-space:nowrap; }
.evento p{ margin:5px 0 0; font-size:2.8vh; font-weight:bold; }

.urgente{ border:8px solid red !important; animation:blink 0.8s linear infinite; }
@keyframes blink{ 0%{background:#00ff00;} 50%{background:#fff;} 100%{background:#00ff00;} }

#pantalla-evento-activo {
    display:none;
    position:fixed;
    top:0; left:0;
    width:100vw; height:100vh;
    background:#ff0000;
    color:white;
    z-index:100000;
    text-align:center;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

#hora-evento-gigante { font-size:8vh; }
#texto-evento-gigante { font-size:10vh; margin:10px; }

.instruccion { font-size:3.5vh; background:#fff; color:#000; padding:15px; border-radius:50px; }
</style>
</head>

<body>

<button id="btn-inicial" onclick="iniciarSistema()">PULSA PARA ACTIVAR<br>CALENDARIO COMPLETO</button>

<div id="barra">
    <div id="fecha"></div>
    <div id="reloj"></div>
</div>

<div id="pantalla-evento-activo" onclick="detenerAlarmaDirecto()">
    <div id="hora-evento-gigante"></div>
    <div id="texto-evento-gigante"></div>
    <div class="instruccion">TOCA AQUÍ PARA PARAR</div>
</div>

<div class="container">
    <div class="col col-hoy">
        <h1>HOY</h1>
        <button class="btn-repaso" onclick="repasarDia('hoy')">🔊 TODO HOY</button>
        <div id="lista-hoy" class="lista-eventos"></div>
    </div>

    <div class="col col-manana">
        <h1>MAÑANA</h1>
        <button class="btn-repaso" onclick="repasarDia('manana')">🔊 TODO MAÑANA</button>
        <div id="lista-manana" class="lista-eventos"></div>
    </div>
</div>

<audio id="campana" src="campana.mp3"></audio>

<script>

// 🔴 PEGA AQUÍ TU ICS
const ICS_URL = "https://calendar.google.com/calendar/embed?src=anacara1941%40gmail.com&ctz=Europe%2FMadrid";

let eventosHoy=[], eventosManana=[];
let idEventoActual=null;
let eventosSilenciados=new Set();
let avisosPrevios=new Set();
let vozSeleccionada=null;

// VOCES
function cargarVoces(){
    const voces=window.speechSynthesis.getVoices();
    vozSeleccionada=voces.find(v=>v.lang.startsWith("es"));
}
setTimeout(cargarVoces,1000);

// RELOJ
function actualizarReloj(){
    const ahora=new Date();
    document.getElementById("fecha").innerText=ahora.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}).toUpperCase();
    document.getElementById("reloj").innerText=ahora.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
    render();
}

// INICIO
function iniciarSistema(){
    document.getElementById("btn-inicial").style.display="none";
    document.querySelector(".container").style.display="flex";

    cargarCalendario();
    setInterval(actualizarReloj,1000);
    setInterval(cargarCalendario,300000);
    setInterval(verificarAlertas,5000);
}

// 🔥 CARGAR ICS
async function cargarCalendario(){
    try{
        const r=await fetch(ICS_URL);
        const txt=await r.text();
        const eventos=parseICS(txt);
        organizarEventos(eventos);
        render();
    }catch(e){
        alert("Error cargando calendario");
    }
}

// PARSER ICS
function parseICS(data){
    const eventos=[];
    const lineas=data.split("\n");
    let ev=null;

    lineas.forEach(l=>{
        l=l.trim();

        if(l==="BEGIN:VEVENT") ev={};
        else if(l==="END:VEVENT"){ eventos.push(ev); ev=null; }

        else if(ev){
            if(l.startsWith("SUMMARY:")) ev.summary=l.replace("SUMMARY:","");
            if(l.startsWith("DTSTART")) {
                const f=l.split(":")[1];
                ev.start={dateTime:convertirFechaICS(f)};
            }
        }
    });

    return eventos;
}

// FECHA ICS
function convertirFechaICS(f){
    const y=f.substr(0,4);
    const m=f.substr(4,2);
    const d=f.substr(6,2);
    const h=f.substr(9,2);
    const min=f.substr(11,2);
    return `${y}-${m}-${d}T${h}:${min}:00`;
}

// ORGANIZAR
function organizarEventos(items){
    const hoy=new Date().toLocaleDateString();
    const manana=new Date(); manana.setDate(manana.getDate()+1);

    eventosHoy=[]; eventosManana=[];

    items.forEach(i=>{
        const inicio=new Date(i.start.dateTime);

        const ev={
            id:i.summary+inicio,
            titulo:i.summary,
            hora:inicio,
            horaPantalla:inicio.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})
        };

        if(inicio.toLocaleDateString()===hoy) eventosHoy.push(ev);
        else if(inicio.toLocaleDateString()===manana.toLocaleDateString()) eventosManana.push(ev);
    });
}

// RENDER
function render(){
    pintar(eventosHoy,"lista-hoy");
    pintar(eventosManana,"lista-manana");
}

function pintar(lista,id){
    const c=document.getElementById(id);
    c.innerHTML="";
    const ahora=new Date();

    lista.forEach(ev=>{
        const div=document.createElement("div");
        div.className="evento";

        div.innerHTML=`<h2>${ev.horaPantalla}</h2><p>${ev.titulo}</p>`;

        div.onclick=()=>hablar(`Tienes ${ev.titulo}`);

        c.appendChild(div);

        if(ahora>=ev.hora && ahora<=ev.hora.getTime()+600000){
            lanzar(ev);
        }
    });
}

// ALERTA GRANDE
function lanzar(ev){
    idEventoActual=ev.id;
    document.getElementById("hora-evento-gigante").innerText=ev.horaPantalla;
    document.getElementById("texto-evento-gigante").innerText=ev.titulo;
    document.getElementById("pantalla-evento-activo").style.display="flex";

    const campana=document.getElementById("campana");
    campana.loop=true;
    campana.play();

    hablar(`Tienes ${ev.titulo}`);
}

function detenerAlarmaDirecto(){
    idEventoActual=null;
    document.getElementById("pantalla-evento-activo").style.display="none";
    document.getElementById("campana").pause();
    speechSynthesis.cancel();
}

// VOZ
function hablar(t){
    const u=new SpeechSynthesisUtterance(t);
    u.lang="es-ES";
    speechSynthesis.speak(u);
}

// REPASO
function repasarDia(d){
    const lista=d==="hoy"?eventosHoy:eventosManana;
    if(lista.length===0) return hablar("No hay nada");

    let t="Tienes: ";
    lista.forEach(e=>t+=e.titulo+", ");
    hablar(t);
}

// AVISOS
function verificarAlertas(){
    // simplificado
}

</script>
</body>
</html>

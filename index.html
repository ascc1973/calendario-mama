<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Calendario para Mamá</title>
    <style>
        /* Estilos para evitar que la interfaz se mueva */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
            position: fixed;
        }

        /* Pantalla de inicio (Botón Rojo) */
        #pantalla-inicio {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            background-color: #222;
            z-index: 9999;
        }

        #btn-rojo {
            width: 250px;
            height: 250px;
            background-color: #ff0000;
            border-radius: 50%;
            border: 10px solid #fff;
            color: white;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 50px rgba(255,0,0,0.5);
        }

        /* Contenedor Principal */
        #calendario-container {
            display: none; /* Se activa al pulsar el botón */
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            color: white;
            padding: 20px;
        }

        .evento {
            background: #333;
            margin: 10px 0;
            padding: 20px;
            border-radius: 15px;
            border-left: 10px solid #00ff00;
        }

        h1 { font-size: 3rem; text-align: center; margin-bottom: 20px; }
        p { font-size: 1.5rem; }
    </style>
</head>
<body>

    <!-- Botón inicial para cumplir con la política de Autoplay de Chrome -->
    <div id="pantalla-inicio">
        <button id="btn-rojo" onclick="iniciarSistema()">PULSAR<br>PARA EMPEZAR</button>
    </div>

    <div id="calendario-container">
        <h1 id="fecha-hoy">Cargando...</h1>
        <div id="lista-eventos">
            <!-- Aquí se cargan tus eventos -->
        </div>
    </div>

    <script>
        // 1. CONFIGURACIÓN DE VOZ (Optimizada para Android 9)
        function hablar(texto) {
            window.speechSynthesis.cancel(); // Detener cualquier audio previo
            
            const mensaje = new SpeechSynthesisUtterance(texto);
            mensaje.lang = 'es-ES';
            mensaje.volume = 1.0;
            mensaje.rate = 0.9;

            // Forzar carga de voces en Chrome
            let voces = window.speechSynthesis.getVoices();
            mensaje.voice = voces.find(v => v.lang.includes('es')) || voces[0];
            
            window.speechSynthesis.speak(mensaje);
        }

        // 2. FUNCIÓN DE INICIO (Se activa al tocar el botón rojo)
        function iniciarSistema() {
            // Ocultar botón y mostrar calendario
            document.getElementById('pantalla-inicio').style.display = 'none';
            document.getElementById('calendario-container').style.display = 'flex';

            // Forzar Pantalla Completa (Modo Inmersivo por Software)
            const docElm = document.documentElement;
            if (docElm.requestFullscreen) { docElm.requestFullscreen(); }
            else if (docElm.webkitRequestFullScreen) { docElm.webkitRequestFullScreen(); }

            // Saludo inicial y cargar datos
            hablar("Sistema activado. Cargando el calendario de hoy.");
            actualizarFecha();
            cargarEventos(); // Aquí llamas a tu función que trae los datos de GitHub/JSON
        }

        function actualizarFecha() {
            const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('fecha-hoy').innerText = new Date().toLocaleDateString('es-ES', opciones);
        }

        // 3. BLOQUEO DE INTERFERENCIAS
        // Si el usuario desliza y salen los botones, intentamos ocultarlos tras 2 segundos
        window.addEventListener('resize', () => {
            if (window.innerHeight < screen.height) {
                setTimeout(() => {
                    if (document.fullscreenElement === null) {
                        document.documentElement.requestFullscreen();
                    }
                }, 2000);
            }
        });

        // Evitar que se recargue la página al deslizar hacia abajo (Pull-to-refresh)
        document.body.style.overscrollBehavior = 'none';

        // 4. MANTENER EL SISTEMA DESPIERTO
        // Cada 15 minutos "re-activamos" la voz con un silencio para que Chrome no la duerma
        setInterval(() => {
            const silencio = new SpeechSynthesisUtterance("");
            window.speechSynthesis.speak(silencio);
        }, 900000);

        function cargarEventos() {
            // Aquí pones tu lógica actual de lectura de eventos
            // Ejemplo visual:
            const lista = document.getElementById('lista-eventos');
            lista.innerHTML = `
                <div class="evento">
                    <p><strong>10:00</strong> - Tomar medicina</p>
                </div>
            `;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario para Mamá</title>

<style>
:root{ --hoy-bg:#FFEB3B; --manana-bg:#1A237E; }

body,html{
  margin:0;
  padding:0;
  height:100%;
  font-family:'Arial Black',sans-serif;
  background:#000;
  overflow:hidden;
  touch-action: manipulation;
}

#barra{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  background:#000;
  color:#fff;
  text-align:center;
  z-index:1000;
}

#fecha{font-size:2vh;}
#reloj{font-size:4vh;}

#btn-inicial{
  position:fixed;
  width:100vw;
  height:100vh;
  background:#ff0000;
  color:white;
  font-size:5vh;
  border:none;
  z-index:99999;
  cursor:pointer;
}

.container{
  display:none;
  height:100vh;
  padding-top:70px;
  box-sizing:border-box;
  display:flex;
}

.col{
  width:50%;
  padding:10px;
  display:flex;
  flex-direction:column;
  box-sizing:border-box;
}

.col-hoy{ background:var(--hoy-bg); border-right:3px solid #000; }
.col-manana{ background:var(--manana-bg); }

h1{ font-size:2.2vh; margin:2px 0 10px 0; text-align:center; color:#fff; }

.btn-repaso{ 
    width: 100%; 
    padding: 15px; 
    font-size: 1.8vh; 
    border-radius: 10px; 
    border: 3px solid #000; 
    background: #fff; 
    margin-bottom: 15px; 
    cursor: pointer; 
    font-weight: bold;
    box-sizing: border-box;
}

.lista-eventos{
  flex-grow:1;
  display:flex;
  flex-direction:column;
  gap:8px;
  overflow-y:auto;
}

.evento{
  background:#fff;
  border-radius:10px;
  border:3px solid #333;
  padding:10px;
  cursor:pointer;
  color:#000;
  width:100%;
  box-sizing:border-box;
}

.evento h2{
  margin:0;
  color:#d32f2f;
  font-size:2.5vh;
  display:flex;
  gap:10px;
  align-items:baseline;
  white-space:nowrap;
}

.evento p{
  margin:5px 0 0;
  font-size:2.8vh;
  font-weight:bold;
  line-height:1.2;
  color:#000;
}

.urgente{
  border:8px solid red !important;
  animation:blink 0.8s linear infinite;
}

@keyframes blink{
  0%{background:#00ff00;border-color:red;}
  50%{background:#ffffff;border-color:#ffffff;}
  100%{background:#00ff00;border-color:red;}
}

#pantalla-evento-activo{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  background:#ff0000;
  color:white;
  z-index:100000;
  text-align:center;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  cursor:pointer;
}

#hora-evento-gigante{
  font-size:8vh;
  color:#fff;
}

#texto-evento-gigante{
  font-size:10vh;
  margin:10px 20px 30px 20px;
  color:#fff;
  text-transform:uppercase;
}

.instruccion{
  font-size:3.5vh;
  background:#fff;
  color:#000;
  padding:15px 40px;
  border-radius:50px;
  animation:flash 1s infinite;
  font-weight:bold;
}

@keyframes flash{
  0%{opacity:1;}
  50%{opacity:0.5;}
  100%{opacity:1;}
}
</style>
</head>

<body>

<button id="btn-inicial" onclick="iniciarSistema()">
PULSA PARA ACTIVAR<br>CALENDARIO COMPLETO
</button>

<div id="barra">
  <div id="fecha"></div>
  <div id="reloj"></div>
</div>

<div id="pantalla-evento-activo" onclick="detenerAlarmaDirecto()">
  <div id="hora-evento-gigante"></div>
  <div id="texto-evento-gigante"></div>
  <div class="instruccion">TOCA AQUÍ PARA PARAR</div>
</div>

<div class="container">
  <div class="col col-hoy">
    <h1>HOY</h1>
    <button class="btn-repaso" onclick="repasarDia('hoy')">🔊 TODO HOY</button>
    <div id="lista-hoy" class="lista-eventos"></div>
  </div>

  <div class="col col-manana">
    <h1>MAÑANA</h1>
    <button class="btn-repaso" onclick="repasarDia('manana')">🔊 TODO MAÑANA</button>
    <div id="lista-manana" class="lista-eventos"></div>
  </div>
</div>

<audio id="campana" src="campana.mp3"></audio>

<script>
let eventosHoy=[];
let eventosManana=[];
let idEventoActual=null;
let eventosSilenciados=new Set();
let avisosPrevios=new Set();
let vozSeleccionada=null;

function cargarVoces(){
  const voces=window.speechSynthesis.getVoices();
  vozSeleccionada=voces.find(v=>v.lang.startsWith("es")&&v.name.includes("Google"))||
                  voces.find(v=>v.lang.startsWith("es"));
}
window.speechSynthesis.onvoiceschanged=cargarVoces;

function obtenerFranjaHoraria(h){
  if(h>=7&&h<13) return "de la mañana";
  if(h>=14&&h<=20) return "de la tarde";
  if(h>=21||h===0) return "de la noche";
  return "de la madrugada";
}

function iniciarSistema(){
  const doc=document.documentElement;
  if(doc.requestFullscreen) doc.requestFullscreen();

  document.getElementById("btn-inicial").style.display="none";
  document.querySelector(".container").style.display="flex";

  cargarVoces();
  cargarCalendario();

  setInterval(actualizarReloj,1000);
  setInterval(cargarCalendario,60000);
  setInterval(verificarAlertas,5000);
}

function actualizarReloj(){
  const ahora=new Date();
  document.getElementById("fecha").innerText=
    ahora.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}).toUpperCase();

  let h=ahora.getHours();
  let m=ahora.getMinutes();
  let h12=h%12||12;

  document.getElementById("reloj").innerText=
    h12+":"+(m<10?"0"+m:m);

  render();
}

/* =========================
   NUEVA FUENTE: events.json
========================= */
async function cargarCalendario(){
  try{
    const r=await fetch("events.json?t="+Date.now());
    const d=await r.json();

    if(!Array.isArray(d)) return;

    organizarEventos(d);
    render();

  }catch(e){
    console.log("Error cargando events.json",e);
  }
}

function organizarEventos(items){
  const hoy=new Date();
  hoy.setHours(0,0,0,0);

  const manana=new Date(hoy);
  manana.setDate(manana.getDate()+1);

  eventosHoy=[];
  eventosManana=[];

  items.forEach(item=>{
    const inicio=new Date(item.start);

    const h=inicio.getHours();
    const m=inicio.getMinutes();

    const ev={
      id:item.title+inicio.getTime(),
      titulo:item.title||"Sin título",
      hora:inicio,
      franja:obtenerFranjaHoraria(h),
      horaPantalla:(h%12||12)+":"+ (m<10?"0"+m:m),
      textoVoz:`a las ${h%12||12}:${m<10?"0"+m:m} ${obtenerFranjaHoraria(h)}`
    };

    if(inicio.toDateString()===hoy.toDateString()){
      eventosHoy.push(ev);
    } else if(inicio.toDateString()===manana.toDateString()){
      eventosManana.push(ev);
    }
  });
}

function render(){
  renderLista(eventosHoy,"lista-hoy");
  renderLista(eventosManana,"lista-manana");
}

function renderLista(lista,id){
  const cont=document.getElementById(id);
  cont.innerHTML="";

  const ahora=new Date();

  lista.forEach(ev=>{
    const div=document.createElement("div");
    div.className="evento";

    div.innerHTML=`<h2>${ev.horaPantalla} ${ev.franja}</h2><p>${ev.titulo}</p>`;

    div.onclick=()=>hablarDirecto(`Mamá, ${ev.textoVoz} tienes ${ev.titulo}`);

    cont.appendChild(div);

    if(ahora>=ev.hora && ahora-ev.hora<600000){
      lanzarPantallaGigante(ev);
    }
  });
}

function lanzarPantallaGigante(ev){
  idEventoActual=ev.id;

  document.getElementById("hora-evento-gigante").innerText=
    ev.horaPantalla+" "+ev.franja;

  document.getElementById("texto-evento-gigante").innerText=ev.titulo;

  document.getElementById("pantalla-evento-activo").style.display="flex";

  document.getElementById("campana").loop=true;
  document.getElementById("campana").play().catch(()=>{});

  hablarLoop(ev);
}

function hablarLoop(ev){
  if(idEventoActual!==ev.id) return;

  window.speechSynthesis.cancel();

  const u=new SpeechSynthesisUtterance(`Mamá, ${ev.textoVoz} tienes ${ev.titulo}`);

  if(vozSeleccionada) u.voice=vozSeleccionada;
  u.lang="es-ES";
  u.rate=0.85;

  u.onend=()=>{
    if(idEventoActual===ev.id){
      setTimeout(()=>hablarLoop(ev),1500);
    }
  };

  window.speechSynthesis.speak(u);
}

function detenerAlarmaDirecto(){
  idEventoActual=null;
  document.getElementById("pantalla-evento-activo").style.display="none";
  document.getElementById("campana").pause();
  window.speechSynthesis.cancel();
}

function hablarDirecto(texto){
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(texto);
  if(vozSeleccionada) u.voice=vozSeleccionada;
  u.lang="es-ES";
  u.rate=0.9;
  window.speechSynthesis.speak(u);
}

function verificarAlertas(){
  const ahora=new Date();
  [...eventosHoy,...eventosManana].forEach(ev=>{
    const min=Math.floor((ev.hora-ahora)/60000);
    if(min===60||min===120||min===180){
      hablarDirecto(`Recordatorio: ${ev.textoVoz} tienes ${ev.titulo}`);
    }
  });
}

function repasarDia(tipo){
  const lista=tipo==="hoy"?eventosHoy:eventosManana;

  if(lista.length===0){
    hablarDirecto("No hay nada anotado");
    return;
  }

  let t=tipo==="hoy"?"Para hoy tienes: ":"Para mañana tienes: ";

  lista.forEach(ev=>{
    t+=`${ev.textoVoz}, ${ev.titulo}. `;
  });

  hablarDirecto(t);
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario Mamá</title>

<style>
body,html{
  margin:0;
  padding:0;
  height:100%;
  font-family:Arial Black;
  background:#000;
  overflow:hidden;
}

#btn{
  position:fixed;
  width:100%;
  height:100%;
  background:red;
  color:white;
  font-size:5vh;
  border:none;
  z-index:9999;
}

.container{
  display:none;
  height:100vh;
  display:flex;
  padding-top:60px;
}

.col{
  width:50%;
  padding:10px;
  box-sizing:border-box;
  overflow-y:auto;
}

.col-hoy{background:#ffeb3b;color:#000;}
.col-manana{background:#1a237e;color:#fff;}

.evento{
  background:#fff;
  margin-bottom:10px;
  padding:10px;
  border-radius:10px;
  color:#000;
}

.evento h2{
  margin:0;
  color:red;
  font-size:2.2vh;
}

.evento p{
  margin:5px 0 0;
  font-size:2.5vh;
  font-weight:bold;
}
</style>
</head>

<body>

<button id="btn" onclick="start()">PULSA PARA INICIAR</button>

<div class="container">
  <div class="col col-hoy">
    <h2>HOY</h2>
    <div id="hoy"></div>
  </div>

  <div class="col col-manana">
    <h2>MAÑANA</h2>
    <div id="manana"></div>
  </div>
</div>

<script>

let hoy=[], manana=[];

/* ========================= */
function start(){
  document.getElementById("btn").style.display="none";
  document.querySelector(".container").style.display="flex";

  load();
  setInterval(load,60000);
}

/* ========================= */
async function load(){
  try{
    const r = await fetch("events.json?t=" + Date.now());
    const d = await r.json();

    if(Array.isArray(d)){
      parse(d);
      render();
    }

  }catch(e){
    console.log("error json", e);
  }
}

/* =========================
   PARSEO CORRECTO GOOGLE CALENDAR
========================= */
function parse(items){

  hoy = [];
  manana = [];

  const today = new Date();
  today.setHours(0,0,0,0);

  const tomorrow = new Date(today);
  tomorrow.setDate(tomorrow.getDate() + 1);

  items.forEach(e => {

    // 🔥 FIX IMPORTANTE: soporta formato Google Calendar real
    let raw = e.start?.dateTime || e.start?.date;

    if(!raw) return;

    const f = new Date(raw);

    if(isNaN(f.getTime())) return;

    const ev = {
      title: e.title || e.summary || "Sin título",
      time: f,
      text: "a las " +
        (f.getHours()%12||12) + ":" +
        String(f.getMinutes()).padStart(2,"0")
    };

    const day = new Date(f);
    day.setHours(0,0,0,0);

    if(day.getTime() === today.getTime()) hoy.push(ev);
    if(day.getTime() === tomorrow.getTime()) manana.push(ev);
  });
}

/* ========================= */
function render(){
  draw(hoy,"hoy");
  draw(manana,"manana");
}

/* ========================= */
function draw(list,id){

  const c = document.getElementById(id);
  c.innerHTML = "";

  list.forEach(ev => {

    const div = document.createElement("div");
    div.className = "evento";

    div.innerHTML =
      `<h2>${ev.text}</h2>
       <p>${ev.title}</p>`;

    div.onclick = () => {
      alert("Mamá: " + ev.text + " tienes " + ev.title);
    };

    c.appendChild(div);
  });
}

</script>

</body>
</html>

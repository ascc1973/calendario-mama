<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Calendario para Mamá</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; overflow: hidden; 
            background-color: #000; font-family: 'Arial Black', sans-serif; 
        }

        /* Capa de inicio */
        #pantalla-inicio {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        #btn-rojo {
            width: 280px; height: 280px; background: red; color: white;
            border-radius: 50%; border: 10px solid white; font-size: 2rem; font-weight: bold;
        }

        /* Cabecera con fecha y hora */
        #barra {
            height: 15vh; background: black; color: white;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #fecha { font-size: 2.5rem; text-transform: uppercase; }
        #reloj { font-size: 4rem; font-weight: bold; }

        /* Contenedor de dos columnas */
        .container { display: flex; height: 85vh; width: 100%; }
        .columna { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        .hoy { background-color: #f1d933; color: black; }
        .manana { background-color: #1a237e; color: white; }

        .btn-escuchar {
            background: white; border: 4px solid black; padding: 15px;
            font-size: 1.5rem; border-radius: 15px; margin-bottom: 20px; font-weight: bold;
        }

        .lista-tareas { width: 100%; overflow-y: auto; }
        .evento {
            background: rgba(0,0,0,0.1); margin: 10px; padding: 20px;
            border-radius: 15px; border-left: 10px solid #00ff00; font-size: 1.8rem;
        }
        .manana .evento { background: rgba(255,255,255,0.1); border-left: 10px solid #00e5ff; }
    </style>
</head>
<body>

    <div id="pantalla-inicio">
        <button id="btn-rojo" onclick="iniciarSistema()">PULSAR INICIO</button>
    </div>

    <div id="barra">
        <div id="fecha"></div>
        <div id="reloj"></div>
    </div>

    <div class="container">
        <div class="columna hoy">
            <h1>HOY</h1>
            <button class="btn-escuchar" onclick="leer('lista-hoy')">🔊 ESCUCHAR TODO HOY</button>
            <div id="lista-hoy" class="lista-tareas"></div>
        </div>
        <div class="columna manana">
            <h1>MAÑANA</h1>
            <button class="btn-escuchar" onclick="leer('lista-manana')">🔊 ESCUCHAR MAÑANA</button>
            <div id="lista-manana" class="lista-tareas"></div>
        </div>
    </div>

    <script>
        const urlJSON = "https://raw.githubusercontent.com/ascc1973/calendario-mama/main/eventos.json";

        function hablar(t) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t);
            u.lang = 'es-ES';
            window.speechSynthesis.speak(u);
        }

        async function cargar() {
            try {
                const res = await fetch(`${urlJSON}?t=${Date.now()}`);
                const datos = await res.json();
                
                const hoy = new Date().toISOString().split('T')[0];
                const man = new Date(); man.setDate(man.getDate() + 1);
                const manStr = man.toISOString().split('T')[0];

                render(datos.filter(e => e.fecha === hoy), 'lista-hoy');
                render(datos.filter(e => e.fecha === manStr), 'lista-manana');
            } catch (e) { console.log(e); }
        }

        function render(lista, id) {
            const cont = document.getElementById(id);
            if (lista.length === 0) { cont.innerHTML = "<h3>No hay tareas</h3>"; return; }
            cont.innerHTML = lista.map(e => `<div class="evento"><b>${e.hora}</b> - ${e.tarea}</div>`).join('');
        }

        function iniciarSistema() {
            document.getElementById('pantalla-inicio').style.display = 'none';
            // IMPORTANTE: RequestFullscreen ahora se ejecuta por el click del usuario (evita error consola)
            document.documentElement.requestFullscreen().catch(e => console.log(e));
            actualizarReloj();
            cargar();
            hablar("Sistema listo");
        }

        function leer(id) {
            const items = document.getElementById(id).innerText;
            hablar(items.includes("No hay tareas") ? "No tienes tareas." : "Tus tareas son: " + items);
        }

        function actualizarReloj() {
            const n = new Date();
            const opciones = { weekday: 'long', day: 'numeric', month: 'long' };
            document.getElementById('fecha').innerText = n.toLocaleDateString('es-ES', opciones);
            document.getElementById('reloj').innerText = n.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
        }

        setInterval(actualizarReloj, 1000);
        setInterval(cargar, 600000); // Recarga cada 10 min
    </script>
</body>
</html>

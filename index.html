<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calendario para Mamá (Google Directo)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; overflow: hidden; 
            background-color: #000; font-family: 'Arial Black', sans-serif; 
        }

        /* Pantalla de Inicio */
        #pantalla-inicio {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; justify-content: center; align-items: center; z-index: 200;
        }
        #btn-rojo {
            width: 280px; height: 280px; background: red; color: white;
            border-radius: 50%; border: 10px solid white; font-size: 2rem; font-weight: bold;
        }

        /* Pantalla de Alarma Roja */
        #pantalla-alarma {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: red; color: white; display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 150; text-align: center;
        }
        #alarma-texto { font-size: 4rem; padding: 20px; }

        /* Cabecera */
        #barra {
            height: 15vh; background: black; color: white;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #reloj { font-size: 4rem; font-weight: bold; }

        /* Columnas */
        .container { display: flex; height: 85vh; width: 100%; }
        .columna { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .hoy { background-color: #f1d933; color: black; }
        .manana { background-color: #1a237e; color: white; }

        .lista-tareas { width: 100%; overflow-y: auto; }
        .evento {
            background: rgba(255,255,255,0.8); margin: 10px; padding: 20px;
            border-radius: 15px; border: 5px solid transparent; font-size: 1.8rem; color: black;
        }
        
        .urgente {
            border-color: red !important;
            animation: parpadeo 1s infinite;
        }
        @keyframes parpadeo {
            0% { background: white; }
            50% { background: #ffcccc; }
            100% { background: white; }
        }
    </style>
</head>
<body>

    <div id="pantalla-inicio">
        <button id="btn-rojo" onclick="iniciarSistema()">CONECTAR GOOGLE</button>
    </div>

    <div id="pantalla-alarma" onclick="detenerAlarma()">
        <div id="alarma-texto">TAREA</div>
        <h1 style="font-size: 5rem;">TOCA PARA PARAR</h1>
    </div>

    <div id="barra">
        <div id="reloj">00:00</div>
    </div>

    <div class="container">
        <div class="columna hoy">
            <h1>HOY</h1>
            <div id="lista-hoy" class="lista-tareas"></div>
        </div>
        <div class="columna manana">
            <h1>MAÑANA</h1>
            <div id="lista-manana" class="lista-tareas"></div>
        </div>
    </div>

    <audio id="campana" src="https://raw.githubusercontent.com/ascc1973/calendario-mama/main/campana.mp3" loop></audio>

    <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>

    <script>
        // CONFIGURACIÓN OBLIGATORIA
        const CLIENT_ID = 'anacara1941@gmail.com'; 
        const API_KEY = 'AIzaSyDh0DjfE2qqaBeVfww5u84FLp4_elsF7Uc';
        const DISCOVERY_DOC = "https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest";
        const SCOPES = "https://www.googleapis.com/auth/calendar.readonly";

        let tokenClient;
        let gapiInited = false;
        let gisInited = false;
        let eventos = [];
        let avisosPrevios = new Set();
        let eventoActivoId = null;

        function gapiLoaded() { gapi.load('client', async () => {
            await gapi.client.init({ apiKey: API_KEY, discoveryDocs: [DISCOVERY_DOC] });
            gapiInited = true;
        });}

        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID, scope: SCOPES, callback: '', 
            });
            gisInited = true;
        }

        async function listarEventos() {
            const ahora = new Date();
            ahora.setHours(0,0,0,0);
            const res = await gapi.client.calendar.events.list({
                'calendarId': 'primary',
                'timeMin': ahora.toISOString(),
                'showDeleted': false,
                'singleEvents': true,
                'orderBy': 'startTime',
            });
            
            eventos = res.result.items.map(item => {
                const titulo = item.summary || 'Sin título';
                return {
                    id: item.id,
                    titulo: titulo.replace(/\*/g, '').trim(),
                    asteriscos: (titulo.match(/\*/g) || []).length,
                    fecha: new Date(item.start.dateTime || item.start.date)
                };
            });
            render();
        }

        function render() {
            const hoyCont = document.getElementById('lista-hoy');
            const manCont = document.getElementById('lista-manana');
            hoyCont.innerHTML = ''; manCont.innerHTML = '';
            
            const ahora = new Date();
            const mañana = new Date(ahora); mañana.setDate(ahora.getDate() + 1);

            eventos.forEach(ev => {
                const diffMin = (ev.fecha - ahora) / 60000;
                const div = document.createElement('div');
                div.className = 'evento';
                if (ev.asteriscos >= 2 && diffMin <= 120 && diffMin > -60) div.classList.add('urgente');
                
                div.innerHTML = `<b>${ev.fecha.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</b> - ${ev.titulo}`;
                
                if (ev.fecha.toDateString() === ahora.toDateString()) hoyCont.appendChild(div);
                else if (ev.fecha.toDateString() === mañana.toDateString()) manCont.appendChild(div);
            });
        }

        function verificarAlertas() {
            const ahora = new Date();
            eventos.forEach(ev => {
                const min = Math.floor((ev.fecha - ahora) / 60000);
                
                // Alarma 1 hora antes para ** y ***
                if (min === 60 && ev.asteriscos >= 2 && eventoActivoId !== ev.id + "-pre") {
                    lanzarAlarma(ev, "EN 1 HORA");
                    eventoActivoId = ev.id + "-pre";
                }
                // Alarma Hora exacta
                if (min === 0 && eventoActivoId !== ev.id) {
                    lanzarAlarma(ev, "AHORA");
                    eventoActivoId = ev.id;
                }
            });
        }

        function lanzarAlarma(ev, texto) {
            document.getElementById('alarma-texto').innerText = `${texto}: ${ev.titulo}`;
            document.getElementById('pantalla-alarma').style.display = 'flex';
            document.getElementById('campana').play();
            hablar(`Mamá, ${texto} tienes ${ev.titulo}`);
        }

        function detenerAlarma() {
            document.getElementById('pantalla-alarma').style.display = 'none';
            document.getElementById('campana').pause();
            window.speechSynthesis.cancel();
        }

        function hablar(t) {
            const u = new SpeechSynthesisUtterance(t);
            u.lang = 'es-ES'; window.speechSynthesis.speak(u);
        }

        function iniciarSistema() {
            tokenClient.callback = async (resp) => {
                if (resp.error !== undefined) throw (resp);
                document.getElementById('pantalla-inicio').style.display = 'none';
                setInterval(listarEventos, 300000);
                setInterval(verificarAlertas, 5000);
                listarEventos();
            };
            tokenClient.requestAccessToken({prompt: 'consent'});
        }

        setInterval(() => {
            const n = new Date();
            document.getElementById('reloj').innerText = n.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
        }, 1000);
    </script>
</body>
</html>

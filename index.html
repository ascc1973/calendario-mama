<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Calendario mamá</title>
<style>
body {
  font-family: Arial;
  background: #111;
  color: white;
  padding: 20px;
}
.event {
  background: #2d2d2d;
  margin: 10px 0;
  padding: 15px;
  border-radius: 10px;
}
.title {
  font-size: 20px;
  font-weight: bold;
}
.time {
  color: #aaa;
}
</style>
</head>

<body>

<h1>Calendario</h1>

<div id="events"></div>

<script>
async function loadEvents() {
  const res = await fetch("./events.json?_=" + Date.now());
  const events = await res.json();

  const container = document.getElementById("events");
  container.innerHTML = "";

  events.forEach(ev => {
    const div = document.createElement("div");
    div.className = "event";

    div.innerHTML = `
      <div class="title">${ev.title}</div>
      <div class="time">${ev.start}</div>
    `;

    container.appendChild(div);
  });
}

loadEvents();

// refresco rápido (cada 60 segundos)
setInterval(loadEvents, 60000);
</script>

</body>
</html>

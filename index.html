<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario para Mamá</title>

<style>
:root{ --hoy-bg:#FFEB3B; --manana-bg:#1A237E; }

body,html{
  margin:0;
  padding:0;
  height:100%;
  font-family:'Arial Black',sans-serif;
  background:#000;
  overflow:hidden;
  touch-action: manipulation;
}

#barra{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  background:#000;
  color:#fff;
  text-align:center;
  z-index:1000;
}

#fecha{font-size:2.5vh; padding-top: 5px;}
#reloj{font-size:5vh; font-weight: bold;}

#btn-inicial{
  position:fixed;
  width:100vw;
  height:100vh;
  background:#ff0000;
  color:white;
  font-size:5vh;
  border:none;
  z-index:99999;
  cursor:pointer;
  font-weight: bold;
}

.container{
  display:none; /* Se cambia a flex por JS */
  height:100vh;
  padding-top:85px;
  box-sizing:border-box;
  display:flex;
}

.col{
  width:50%;
  padding:10px;
  display:flex;
  flex-direction:column;
  box-sizing:border-box;
}

.col-hoy{ background:var(--hoy-bg); border-right:4px solid #000; }
.col-manana{ background:var(--manana-bg); }

h1{
  font-size:3vh;
  margin:5px 0 15px 0;
  text-align:center;
  color:#000;
}
.col-manana h1 { color: #fff; }

.btn-repaso{
  width:100%;
  padding:20px;
  font-size:2.2vh;
  border-radius:15px;
  border:4px solid #000;
  background:#fff;
  margin-bottom:20px;
  cursor:pointer;
  font-weight:bold;
  text-transform: uppercase;
}

.lista-eventos{
  flex-grow:1;
  display:flex;
  flex-direction:column;
  gap:12px;
  overflow-y:auto;
}

.evento{
  background:#fff;
  border-radius:15px;
  border:4px solid #333;
  padding:15px;
  cursor:pointer;
  color:#000;
  box-shadow: 0 4px 6px rgba(0,0,0,0.2);
}

.evento h2{
  margin:0;
  color:#d32f2f;
  font-size:2.8vh;
}

.evento p{
  margin:8px 0 0;
  font-size:3.2vh;
  font-weight:bold;
  line-height: 1.2;
}

#pantalla-evento-activo{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  background:#ff0000;
  color:white;
  z-index:100000;
  text-align:center;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.instruccion{
  font-size:4vh;
  background:#fff;
  color:#000;
  padding:20px 50px;
  border-radius:60px;
  animation:flash 1s infinite;
  font-weight: bold;
}

@keyframes flash{
  0%{opacity:1;}
  50%{opacity:0.5;}
  100%{opacity:1;}
}
</style>
</head>

<body>

<button id="btn-inicial" onclick="iniciarSistema()">
PULSA AQUÍ PARA EMPEZAR<br><br>🔊
</button>

<div id="barra">
  <div id="fecha"></div>
  <div id="reloj"></div>
</div>

<div id="pantalla-evento-activo" onclick="detener()">
  <div id="hora-evento-gigante"></div>
  <div id="texto-evento-gigante"></div>
  <div class="instruccion">TOCA PARA PARAR</div>
</div>

<div class="container" id="main-container">
  <div class="col col-hoy">
    <h1>HOY</h1>
    <button class="btn-repaso" onclick="repasar('hoy')">🔊 ESCUCHAR TODO HOY</button>
    <div id="lista-hoy" class="lista-eventos"></div>
  </div>

  <div class="col col-manana">
    <h1>MAÑANA</h1>
    <button class="btn-repaso" onclick="repasar('manana')">🔊 ESCUCHAR MAÑANA</button>
    <div id="lista-manana" class="lista-eventos"></div>
  </div>
</div>

<script>
let eventosHoy=[];
let eventosManana=[];

/* =========================
   INICIO (VERSIÓN BÚNKER)
========================= */
function iniciarSistema(){
  console.log("Iniciando sistema...");

  // 1. Quitar botón rojo inmediatamente
  document.getElementById("btn-inicial").style.display="none";
  document.getElementById("main-container").style.display="flex";

  // 2. Intentar pantalla completa (si falla, no bloquea lo demás)
  try {
    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(err => console.log("Fullscreen bloqueado"));
    }
  } catch(e) {}

  // 3. Despertar audio
  despertarVoz();

  // 4. Arrancar procesos
  cargar();
  setInterval(actualizarReloj,1000);
  setInterval(cargar, 60000);
}

function despertarVoz() {
  try {
    // Esto crea un sonido electrónico invisible que "abre" el altavoz
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = audioCtx.createOscillator();
    oscillator.type = 'sine';
    oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
    oscillator.connect(audioCtx.destination);
    oscillator.start();
    oscillator.stop(audioCtx.currentTime + 0.0001); // Casi instantáneo

    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance("Sistema activado");
    u.lang = "es-ES";
    u.volume = 1;
    window.speechSynthesis.speak(u);
  } catch(e) { console.log("Error de audio"); }
}

/* =========================
   RELOJ Y CARGA
========================= */
function actualizarReloj(){
  const a=new Date();
  document.getElementById("fecha").innerText=
    a.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}).toUpperCase();
  let h=a.getHours();
  let m=a.getMinutes();
  document.getElementById("reloj").innerText= (h%12||12)+":"+(m<10?"0"+m:m) + (h>=12?" PM":" AM");
}

async function cargar(){
  try{
    const r=await fetch("events.json?t="+Date.now());
    const d=await r.json();
    if(Array.isArray(d)){
      procesar(d);
      render();
    }
  }catch(e){ console.error("Error cargando JSON", e); }
}

function parseFecha(s){
  if(!s) return new Date(0);
  s=s.replace("Z","");
  if(s.includes("T")){
    return new Date(s.slice(0,4), s.slice(4,6)-1, s.slice(6,8), s.slice(9,11), s.slice(11,13));
  }
  return new Date(s);
}

function procesar(items){
  eventosHoy=[]; eventosManana=[];
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const manana=new Date(hoy); manana.setDate(manana.getDate()+1);

  items.forEach(e=>{
    const f=parseFecha(e.start);
    const ev={
      titulo: e.title,
      horaStr: (f.getHours()%12||12)+":"+String(f.getMinutes()).padStart(2,"0"),
      textoVoz: `A las ${f.getHours()%12||12} y ${f.getMinutes() === 0 ? "punto" : f.getMinutes()}, ${e.title}`,
      fechaObj: f
    };
    const d=new Date(f); d.setHours(0,0,0,0);
    if(d.getTime()===hoy.getTime()) eventosHoy.push(ev);
    if(d.getTime()===manana.getTime()) eventosManana.push(ev);
  });
  eventosHoy.sort((a,b)=>a.fechaObj - b.fechaObj);
  eventosManana.sort((a,b)=>a.fechaObj - b.fechaObj);
}

/* =========================
   RENDER Y HABLAR
========================= */
function render(){
  pintar(eventosHoy,"lista-hoy");
  pintar(eventosManana,"lista-manana");
}

function pintar(lista,id){
  const c=document.getElementById(id);
  c.innerHTML="";
  if(lista.length === 0){
    c.innerHTML = "<p style='text-align:center; opacity:0.6; color:#000;'>No hay tareas</p>";
    return;
  }
  lista.forEach(ev=>{
    const div=document.createElement("div");
    div.className="evento";
    div.innerHTML=`<h2>${ev.horaStr}</h2><p>${ev.titulo}</p>`;
    
    // El evento 'click' es el más compatible
    div.onclick = function() {
        hablar("Mamá, " + ev.textoVoz);
    };
    
    c.appendChild(div);
  });
}

function hablar(texto){
  if (!window.speechSynthesis) return;
  
  window.speechSynthesis.cancel();

  setTimeout(() => {
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = "es-ES";
    u.rate = 0.85;
    u.volume = 1;

    const voces = window.speechSynthesis.getVoices();
    const voz = voces.find(v => v.lang.includes("es"));
    if (voz) u.voice = voz;

    window.speechSynthesis.speak(u);
  }, 50); 
}

function repasar(tipo){
  const lista = tipo === "hoy" ? eventosHoy : eventosManana;
  let texto = tipo === "hoy" ? "Para hoy tienes: " : "Para mañana tienes: ";
  if(lista.length === 0) {
    hablar("No tienes tareas para " + (tipo === "hoy" ? "hoy" : "mañana"));
    return;
  }
  lista.forEach(e => { texto += e.textoVoz + ". "; });
  hablar(texto);
}

function detener(){
  window.speechSynthesis.cancel();
  document.getElementById("pantalla-evento-activo").style.display="none";
}
</script>
</body>
</html>

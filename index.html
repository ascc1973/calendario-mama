<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calendario para Mamá</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; overflow: hidden; 
            background-color: #000; font-family: 'Arial Black', sans-serif; 
        }

        /* PANTALLA INICIAL TODA ROJA */
        #pantalla-inicio {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: red; color: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 300; text-align: center;
            cursor: pointer;
        }

        /* PANTALLA ALARMA ROJA */
        #pantalla-alarma {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ff0000; color: white; display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 200; text-align: center;
        }

        /* CABECERA */
        #barra {
            height: 15vh; background: black; color: white;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #reloj { font-size: 5rem; font-weight: bold; line-height: 1; }
        #fecha { font-size: 2rem; text-transform: uppercase; margin-top: 5px; }

        /* COLUMNAS */
        .container { display: flex; height: 85vh; width: 100%; }
        .columna { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 15px; position: relative; }
        .hoy { background-color: #f1d933; color: black; }
        .manana { background-color: #1a237e; color: white; }

        .btn-escuchar {
            background: white; border: 4px solid black; padding: 15px;
            font-size: 1.5rem; border-radius: 15px; margin-bottom: 20px; font-weight: bold; cursor: pointer;
        }

        .lista-tareas { width: 100%; overflow-y: auto; text-align: center; }
        .evento {
            background: rgba(255,255,255,0.9); margin: 15px; padding: 25px;
            border-radius: 20px; border: 8px solid transparent; font-size: 2.2rem; color: black;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* PARPADEO */
        .urgente {
            border-color: red !important;
            -webkit-animation: parpadeo 0.8s infinite;
            animation: parpadeo 0.8s infinite;
        }
        @-webkit-keyframes parpadeo { 0%, 100% { background-color: #fff; } 50% { background-color: #ffb3b3; } }
        @keyframes parpadeo { 0%, 100% { background-color: #fff; } 50% { background-color: #ffb3b3; } }
    </style>
</head>
<body>

    <div id="pantalla-inicio" onclick="iniciarSistema()">
        <h1 style="font-size: 6rem;">TOCAR AQUÍ</h1>
        <p style="font-size: 2rem;">PARA EMPEZAR</p>
    </div>

    <div id="pantalla-alarma" onclick="detenerAlarma()">
        <h1 id="alarma-texto" style="font-size: 4rem;">AVISO</h1>
        <div id="alarma-reloj" style="font-size: 6rem;">00:00</div>
        <button class="btn-escuchar" style="font-size: 3rem; padding: 40px; margin-top: 30px;">PARAR ALARMA</button>
    </div>

    <div id="barra">
        <div id="reloj">00:00</div>
        <div id="fecha">CARGANDO...</div>
    </div>

    <div class="container">
        <div class="columna hoy">
            <h1 style="font-size: 3rem; margin-bottom: 10px;">HOY</h1>
            <button class="btn-escuchar" onclick="leer('lista-hoy')">🔊 ESCUCHAR HOY</button>
            <div id="lista-hoy" class="lista-tareas">Buscando tareas...</div>
        </div>
        <div class="columna manana">
            <h1 style="font-size: 3rem; margin-bottom: 10px;">MAÑANA</h1>
            <button class="btn-escuchar" onclick="leer('lista-manana')">🔊 ESCUCHAR MAÑANA</button>
            <div id="lista-manana" class="lista-tareas">Buscando tareas...</div>
        </div>
    </div>

    <audio id="campana" src="https://raw.githubusercontent.com/ascc1973/calendario-mama/main/campana.mp3" loop></audio>

    <script>
        const urlJSON = "https://raw.githubusercontent.com/ascc1973/calendario-mama/main/eventos.json";
        let eventosGlobales = [];
        let avisosHechos = new Set();
        let avisoActivo = null;

        function hablar(t, callback) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t);
            u.lang = 'es-ES';
            u.rate = 0.8;
            if (callback) u.onend = callback;
            window.speechSynthesis.speak(u);
        }

        async function cargar() {
            try {
                const res = await fetch(`${urlJSON}?t=${Date.now()}`);
                const datos = await res.json();
                eventosGlobales = datos;
                
                // Cálculo de fechas local
                const hoy = new Date();
                const manana = new Date();
                manana.setDate(hoy.getDate() + 1);

                const hoyF = hoy.toLocaleDateString('en-CA'); // "YYYY-MM-DD"
                const mananaF = manana.toLocaleDateString('en-CA');

                render(datos.filter(e => e.fecha === hoyF), 'lista-hoy');
                render(datos.filter(e => e.fecha === mananaF), 'lista-manana');
            } catch (e) {
                document.getElementById('lista-hoy').innerHTML = "Error al conectar";
                console.error(e);
            }
        }

        function render(lista, id) {
            const cont = document.getElementById(id);
            if (lista.length === 0) {
                cont.innerHTML = "<h2 style='opacity:0.5; margin-top:20px;'>No hay tareas</h2>";
                return;
            }
            
            const ahora = new Date();
            cont.innerHTML = lista.map(e => {
                const [h, m] = e.hora.split(':');
                const fechaEv = new Date();
                fechaEv.setHours(parseInt(h), parseInt(m), 0);
                
                const diffMin = (fechaEv - ahora) / 60000;
                const asteriscos = (e.tarea.match(/\*/g) || []).length;
                
                // Parpadeo: si faltan menos de 125 min y tiene **
                let urgente = (asteriscos >= 2 && diffMin <= 125 && diffMin > -60) ? 'urgente' : '';
                
                return `<div class="evento ${urgente}"><b>${e.hora}</b><br>${e.tarea.replace(/\*/g, '')}</div>`;
            }).join('');
        }

        function verificarAlertas() {
            const ahora = new Date();
            eventosGlobales.forEach(e => {
                const [h, m] = e.hora.split(':');
                const evTime = new Date();
                evTime.setHours(parseInt(h), parseInt(m), 0);
                
                const min = Math.floor((evTime - ahora) / 60000);
                const asteriscos = (e.tarea.match(/\*/g) || []).length;
                const limpia = e.tarea.replace(/\*/g, '');

                // Pantalla Roja: 1h antes (**) o Hora exacta (Todos)
                if ((min === 60 && asteriscos >= 2 && avisoActivo !== e.tarea + "1h") || 
                    (min === 0 && avisoActivo !== e.tarea)) {
                    
                    const prefijo = (min === 60) ? "DENTRO DE UNA HORA" : "AHORA MISMO";
                    avisoActivo = (min === 60) ? e.tarea + "1h" : e.tarea;
                    
                    lanzarAlarma(`${prefijo}: ${limpia}`, e.hora);
                }
            });
        }

        function lanzarAlarma(msg, hora) {
            const p = document.getElementById('pantalla-alarma');
            document.getElementById('alarma-texto').innerText = msg;
            document.getElementById('alarma-reloj').innerText = hora;
            p.style.display = 'flex';
            document.getElementById('campana').play();
            
            const bucle = () => { if(p.style.display==='flex') hablar("Mamá, " + msg, bucle); };
            bucle();
        }

        function detenerAlarma() {
            document.getElementById('pantalla-alarma').style.display = 'none';
            document.getElementById('campana').pause();
            window.speechSynthesis.cancel();
        }

        function iniciarSistema() {
            document.getElementById('pantalla-inicio').style.display = 'none';
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            actualizarReloj();
            cargar();
            setInterval(verificarAlertas, 10000);
            setInterval(cargar, 60000); // Recarga cada minuto
            hablar("Sistema listo");
        }

        function actualizarReloj() {
            const n = new Date();
            document.getElementById('fecha').innerText = n.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
            document.getElementById('reloj').innerText = n.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
        }

        function leer(id) {
            const t = document.getElementById(id).innerText;
            hablar(t.includes("No hay tareas") ? "No tienes nada pendiente." : "Tus tareas son: " + t);
        }

        setInterval(actualizarReloj, 1000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario para Mamá</title>

<style>
:root{ --hoy-bg:#FFEB3B; --manana-bg:#1A237E; }

body,html{
  margin:0;
  padding:0;
  height:100%;
  font-family:'Arial Black',sans-serif;
  background:#000;
  overflow:hidden;
}

#barra{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  background:#000;
  color:#fff;
  text-align:center;
  z-index:1000;
}

#fecha{font-size:2vh;}
#reloj{font-size:4vh;}

#btn-inicial{
  position:fixed;
  width:100vw;
  height:100vh;
  background:#ff0000;
  color:white;
  font-size:5vh;
  border:none;
  z-index:99999;
}

.container{
  display:none;
  height:100vh;
  padding-top:70px;
  display:flex;
}

.col{
  width:50%;
  padding:10px;
  box-sizing:border-box;
  overflow-y:auto;
}

.col-hoy{background:#FFEB3B;}
.col-manana{background:#1A237E;color:#fff;}

h1{
  text-align:center;
}

.evento{
  background:#fff;
  margin-bottom:10px;
  padding:10px;
  border-radius:10px;
  color:#000;
}

.evento h2{
  margin:0;
  color:red;
}

.evento p{
  margin:5px 0 0;
  font-weight:bold;
}

</style>
</head>

<body>

<button id="btn-inicial" onclick="iniciarSistema()">
PULSA PARA INICIAR
</button>

<div id="barra">
  <div id="fecha"></div>
  <div id="reloj"></div>
</div>

<div class="container">
  <div class="col col-hoy">
    <h1>HOY</h1>
    <div id="lista-hoy"></div>
  </div>

  <div class="col col-manana">
    <h1>MAÑANA</h1>
    <div id="lista-manana"></div>
  </div>
</div>

<script>

let eventosHoy=[];
let eventosManana=[];

/* ========================= */
function iniciarSistema(){

  document.getElementById("btn-inicial").style.display="none";
  document.querySelector(".container").style.display="flex";

  cargar();

  setInterval(cargar,60000);
  setInterval(reloj,1000);
}

/* ========================= */
function reloj(){
  const a=new Date();

  document.getElementById("fecha").innerText=
    a.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});

  document.getElementById("reloj").innerText=
    a.getHours()+":"+String(a.getMinutes()).padStart(2,"0");
}

/* ========================= */
async function cargar(){

  try{

    const r = await fetch("events.json?t="+Date.now());
    const d = await r.json();

    procesar(d);
    render();

  }catch(e){
    console.log("error json", e);
  }
}

/* ========================= */
function procesar(items){

  eventosHoy=[];
  eventosManana=[];

  const hoy=new Date();
  hoy.setHours(0,0,0,0);

  const manana=new Date(hoy);
  manana.setDate(manana.getDate()+1);

  items.forEach(e=>{

    const raw =
      e.start?.dateTime ||
      e.start ||
      e.date;

    if(!raw) return;

    const f = new Date(raw);

    if(isNaN(f)) return;

    const ev={
      titulo:e.title || e.summary || "Sin título",
      hora:f,
      texto:`a las ${f.getHours()%12||12}:${String(f.getMinutes()).padStart(2,"0")}`
    };

    const d = new Date(f);
    d.setHours(0,0,0,0);

    if(d.getTime()===hoy.getTime()) eventosHoy.push(ev);
    if(d.getTime()===manana.getTime()) eventosManana.push(ev);
  });
}

/* ========================= */
function render(){
  pintar(eventosHoy,"lista-hoy");
  pintar(eventosManana,"lista-manana");
}

/* ========================= */
function pintar(lista,id){

  const c=document.getElementById(id);
  c.innerHTML="";

  lista.forEach(ev=>{

    const div=document.createElement("div");
    div.className="evento";

    div.innerHTML=`<h2>${ev.texto}</h2><p>${ev.titulo}</p>`;

    div.onclick=()=>hablar(ev);

    c.appendChild(div);
  });
}

/* =========================
   🔥 VOZ CORREGIDA (ESTABLE EN TABLET)
========================= */
function hablar(ev){

  const texto = "Mamá, " + ev.texto + " tienes " + ev.titulo;

  const audio = new Audio(
    "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=es&q=" +
    encodeURIComponent(texto)
  );

  audio.play().catch(e=>{
    console.log("audio bloqueado", e);
  });
}

</script>

</body>
</html>

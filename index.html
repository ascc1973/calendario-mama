<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calendario para Mamá</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; overflow: hidden; 
            background-color: #000; font-family: 'Arial Black', sans-serif; 
        }

        /* PANTALLA INICIAL TODA ROJA */
        #pantalla-inicio {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: red; color: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 300; text-align: center;
            cursor: pointer;
        }
        #pantalla-inicio h1 { font-size: 5rem; margin-bottom: 20px; }
        #pantalla-inicio p { font-size: 2rem; }

        /* PANTALLA ALARMA ROJA (PARA AVISOS) */
        #pantalla-alarma {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ff0000; color: white; display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 200; text-align: center;
        }

        /* CABECERA Y RELOJ */
        #barra {
            height: 15vh; background: black; color: white;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #fecha { font-size: 2.2rem; text-transform: uppercase; }
        #reloj { font-size: 4.5rem; font-weight: bold; }

        /* COLUMNAS HOY/MAÑANA */
        .container { display: flex; height: 85vh; width: 100%; }
        .columna { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 15px; }
        .hoy { background-color: #f1d933; color: black; }
        .manana { background-color: #1a237e; color: white; }

        .btn-escuchar {
            background: white; border: 4px solid black; padding: 15px;
            font-size: 1.5rem; border-radius: 15px; margin-bottom: 20px; font-weight: bold;
        }

        .lista-tareas { width: 100%; overflow-y: auto; }
        .evento {
            background: rgba(255,255,255,0.9); margin: 10px; padding: 20px;
            border-radius: 15px; border: 8px solid transparent; font-size: 2rem; color: black;
        }

        /* ANIMACIÓN PARPADEO ROJO */
        .urgente {
            border-color: red !important;
            -webkit-animation: parpadeo 0.8s infinite;
            animation: parpadeo 0.8s infinite;
        }
        @-webkit-keyframes parpadeo {
            0% { background-color: #fff; }
            50% { background-color: #ffcccc; }
            100% { background-color: #fff; }
        }
        @keyframes parpadeo {
            0% { background-color: #fff; }
            50% { background-color: #ffcccc; }
            100% { background-color: #fff; }
        }
    </style>
</head>
<body>

    <!-- Pantalla Inicial Roja -->
    <div id="pantalla-inicio" onclick="iniciarSistema()">
        <h1>PULSAR PARA EMPEZAR</h1>
        <p>Toca cualquier parte de la pantalla</p>
    </div>

    <!-- Pantalla de Alarma -->
    <div id="pantalla-alarma" onclick="detenerAlarma()">
        <h1 id="alarma-texto" style="font-size: 4rem;">TAREA</h1>
        <div id="alarma-reloj" style="font-size: 6rem;">00:00</div>
        <button class="btn-escuchar" style="font-size: 3rem; padding: 30px; margin-top: 20px;">TOCAR PARA PARAR</button>
    </div>

    <div id="barra">
        <div id="fecha"></div>
        <div id="reloj">00:00</div>
    </div>

    <div class="container">
        <div class="columna hoy">
            <h1>HOY</h1>
            <button class="btn-escuchar" onclick="leer('lista-hoy')">🔊 ESCUCHAR TODO HOY</button>
            <div id="lista-hoy" class="lista-tareas"></div>
        </div>
        <div class="columna manana">
            <h1>MAÑANA</h1>
            <button class="btn-escuchar" onclick="leer('lista-manana')">🔊 ESCUCHAR MAÑANA</button>
            <div id="lista-manana" class="lista-tareas"></div>
        </div>
    </div>

    <audio id="campana" src="https://raw.githubusercontent.com/ascc1973/calendario-mama/main/campana.mp3" loop></audio>

    <script>
        const urlJSON = "https://raw.githubusercontent.com/ascc1973/calendario-mama/main/eventos.json";
        let eventosGlobales = [];
        let avisosHechos = new Set();
        let eventoActivoId = null;

        function hablar(texto, callback) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(texto);
            u.lang = 'es-ES';
            u.rate = 0.85;
            if (callback) u.onend = callback;
            window.speechSynthesis.speak(u);
        }

        async function cargarDatos() {
            try {
                // El Date.now evita que la tablet use una versión vieja guardada en memoria
                const respuesta = await fetch(`${urlJSON}?t=${Date.now()}`);
                const datos = await respuesta.json();
                eventosGlobales = datos;
                
                const hoyStr = new Date().toISOString().split('T')[0];
                const manana = new Date(); manana.setDate(manana.getDate() + 1);
                const manStr = manana.toISOString().split('T')[0];

                renderizar(datos.filter(e => e.fecha === hoyStr), 'lista-hoy');
                renderizar(datos.filter(e => e.fecha === manStr), 'lista-manana');
            } catch (e) { console.error("Error al cargar:", e); }
        }

        function renderizar(lista, idContenedor) {
            const cont = document.getElementById(idContenedor);
            if (lista.length === 0) { cont.innerHTML = "<h3>No hay tareas</h3>"; return; }
            
            const ahora = new Date();
            
            cont.innerHTML = lista.map(e => {
                const [h, m] = e.hora.split(':');
                const fechaEv = new Date();
                fechaEv.setHours(h, m, 0);
                
                const diffMin = (fechaEv - ahora) / 60000;
                const asteriscos = (e.tarea.match(/\*/g) || []).length;
                
                // Parpadeo si tiene 2 o 3 estrellas y faltan menos de 2 horas (125 min)
                let claseUrgente = (asteriscos >= 2 && diffMin <= 125 && diffMin > -60) ? 'urgente' : '';
                
                return `<div class="evento ${claseUrgente}"><b>${e.hora}</b> - ${e.tarea.replace(/\*/g, '')}</div>`;
            }).join('');
        }

        function revisarAlertas() {
            const ahora = new Date();
            eventosGlobales.forEach(e => {
                const [h, m] = e.hora.split(':');
                const fechaEv = new Date();
                fechaEv.setHours(h, m, 0);
                
                const min = Math.floor((fechaEv - ahora) / 60000);
                const asteriscos = (e.tarea.match(/\*/g) || []).length;
                const tareaLimpia = e.tarea.replace(/\*/g, '');

                // Avisos previos de voz (3h y 2h)
                if ((asteriscos === 3 && min === 180) || (asteriscos >= 2 && min === 120)) {
                    const idAviso = `${e.fecha}-${e.hora}-${min}`;
                    if (!avisosHechos.has(idAviso)) {
                        hablar(`Recordatorio para mamá: en ${min/60} horas tienes ${tareaLimpia}`);
                        avisosHechos.add(idAviso);
                    }
                }

                // Pantalla Roja de ALARMA (1 hora antes para ** y ***)
                if (min === 60 && asteriscos >= 2 && eventoActivoId !== e.tarea + "-1h") {
                    mostrarAlarma(e, "EN UNA HORA");
                    eventoActivoId = e.tarea + "-1h";
                }

                // Pantalla Roja de ALARMA (Hora exacta para todos)
                if (min === 0 && eventoActivoId !== e.tarea) {
                    mostrarAlarma(e, "AHORA");
                    eventoActivoId = e.tarea;
                }
            });
        }

        function mostrarAlarma(e, prefijo) {
            const p = document.getElementById('pantalla-alarma');
            document.getElementById('alarma-texto').innerText = `${prefijo}: ${e.tarea.replace(/\*/g, '')}`;
            document.getElementById('alarma-reloj').innerText = e.hora;
            p.style.display = 'flex';
            document.getElementById('campana').play();
            
            const repetirVoz = () => {
                if (p.style.display === 'flex') {
                    hablar(`Mamá, ${prefijo} tienes ${e.tarea.replace(/\*/g, '')}`, repetirVoz);
                }
            };
            repetirVoz();
        }

        function detenerAlarma() {
            document.getElementById('pantalla-alarma').style.display = 'none';
            document.getElementById('campana').pause();
            window.speechSynthesis.cancel();
        }

        function iniciarSistema() {
            document.getElementById('pantalla-inicio').style.display = 'none';
            // Intentar poner pantalla completa
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            
            actualizarReloj();
            cargarDatos();
            setInterval(revisarAlertas, 10000); // Revisa cada 10 segundos
            setInterval(cargarDatos, 300000);  // Recarga JSON cada 5 min
            hablar("Sistema encendido.");
        }

        function actualizarReloj() {
            const n = new Date();
            const opciones = { weekday: 'long', day: 'numeric', month: 'long' };
            document.getElementById('fecha').innerText = n.toLocaleDateString('es-ES', opciones);
            document.getElementById('reloj').innerText = n.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
        }

        function leer(id) {
            const texto = document.getElementById(id).innerText;
            hablar(texto.includes("No hay tareas") ? "No hay nada pendiente." : "Tus tareas son: " + texto);
        }

        setInterval(actualizarReloj, 1000);
    </script>
</body>
</html>

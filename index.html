<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario para Mamá</title>

<style>
body,html{
  margin:0;
  padding:0;
  height:100%;
  font-family:Arial Black;
  background:#000;
  overflow:hidden;
}

#barra{
  position:fixed;
  top:0;
  width:100%;
  background:#000;
  color:#fff;
  text-align:center;
  z-index:1000;
}

#fecha{font-size:2vh;}
#reloj{font-size:4vh;}

#btn{
  position:fixed;
  width:100%;
  height:100%;
  background:red;
  color:white;
  font-size:5vh;
  border:none;
  z-index:9999;
}

.container{
  display:none;
  height:100vh;
  padding-top:70px;
  display:flex;
}

.col{
  width:50%;
  padding:10px;
  box-sizing:border-box;
}

.col-hoy{background:#FFEB3B;}
.col-manana{background:#1A237E;color:white;}

.evento{
  background:white;
  margin-bottom:10px;
  padding:10px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.evento h2{
  margin:0;
  color:red;
}

.evento p{
  margin:5px 0 0;
}

</style>
</head>

<body>

<button id="btn" onclick="start()">PULSA PARA INICIAR</button>

<div id="barra">
  <div id="fecha"></div>
  <div id="reloj"></div>
</div>

<div class="container">
  <div class="col col-hoy">
    <h2>HOY</h2>
    <div id="hoy"></div>
  </div>

  <div class="col col-manana">
    <h2>MAÑANA</h2>
    <div id="manana"></div>
  </div>
</div>

<script>

let hoy=[], manana=[];

/* ========================= */
function start(){
  document.getElementById("btn").style.display="none";
  document.querySelector(".container").style.display="flex";

  load();
  setInterval(load,60000);
  setInterval(clock,1000);
}

/* ========================= */
function clock(){
  const a=new Date();
  document.getElementById("fecha").innerText=
    a.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});

  document.getElementById("reloj").innerText=
    a.getHours()+":"+String(a.getMinutes()).padStart(2,"0");
}

/* ========================= */
async function load(){
  try{
    const r=await fetch("events.json?t="+Date.now());
    const d=await r.json();

    parse(d);
    render();

  }catch(e){}
}

/* ========================= */
function parse(items){

  hoy=[];
  manana=[];

  const h=new Date();
  h.setHours(0,0,0,0);

  const m=new Date(h);
  m.setDate(m.getDate()+1);

  items.forEach(e=>{

    const f=new Date(e.start);

    const ev={
      title:e.title,
      time:f,
      text:`a las ${f.getHours()%12||12}:${String(f.getMinutes()).padStart(2,"0")}`
    };

    const d=new Date(f);
    d.setHours(0,0,0,0);

    if(d.getTime()===h.getTime()) hoy.push(ev);
    if(d.getTime()===m.getTime()) manana.push(ev);
  });
}

/* ========================= */
function render(){
  draw(hoy,"hoy");
  draw(manana,"manana");
}

/* ========================= */
function draw(list,id){
  const c=document.getElementById(id);
  c.innerHTML="";

  list.forEach(ev=>{
    const div=document.createElement("div");
    div.className="evento";

    div.innerHTML=`<h2>${ev.text}</h2><p>${ev.title}</p>`;

    div.onclick=()=>speak("Mamá, "+ev.text+" tienes "+ev.title);

    c.appendChild(div);
  });
}

/* =========================
   VOZ 100% ESTABLE (WEB AUDIO)
========================= */
function speak(text){

  const audio = new Audio(
    "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=es&q=" +
    encodeURIComponent(text)
  );

  audio.play().catch(err=>{
    console.log("Audio bloqueado:", err);
  });
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Calendario para Mamá</title>
<style>
:root{ --hoy-bg:#FFEB3B; --manana-bg:#1A237E; }
* { -webkit-user-select: none; -webkit-touch-callout: none; user-select: none; overscroll-behavior: none; box-sizing: border-box; }
body, html { margin:0; padding:0; height:100%; font-family:'Arial Black',sans-serif; background:#000; overflow:hidden; position: fixed; width: 100%; }
#barra{ position:fixed; top:0; left:0; width:100%; background:#000; color:#fff; text-align:center; z-index:1000; padding: 5px 0; }
#fecha{font-size:2vh; text-transform: uppercase;} #reloj{font-size:4vh;}
#btn-inicial{ position:fixed; width:100vw; height:100vh; background:#ff0000; color:white; font-size:5vh; border:none; z-index:99999; cursor:pointer; font-weight: bold; }
.container{ display:none; height:100vh; padding-top:80px; width: 100%; }
.col{ width:50%; padding:15px; display:flex; flex-direction:column; height: 100%; }
.col-hoy{ background:var(--hoy-bg); border-right:4px solid #000; }
.col-manana{ background:var(--manana-bg); color: white; }
h1{ font-size:2.5vh; margin:0 0 15px 0; text-align:center; color: inherit; }
.btn-repaso{ width: 100%; padding: 15px; font-size: 2vh; border-radius: 12px; border: 3px solid #000; background: #fff; color: #000; margin-bottom: 15px; cursor: pointer; font-weight: bold; }
.lista-eventos{ flex-grow:1; display:flex; flex-direction:column; gap:10px; overflow-y: auto; }
.evento{ background:#fff; border-radius:12px; border:4px solid #333; padding:12px; color:#000; width: 100%; cursor: pointer; }
.evento h2{ margin:0; color:#d32f2f; font-size:2.4vh; }
.evento p{ margin:8px 0 0; font-size:2.8vh; font-weight:bold; line-height: 1.1; }
.urgente{ border:8px solid red !important; animation:blink 0.8s linear infinite; }
@keyframes blink{ 0%{background:#00ff00;} 50%{background:#ffffff;} 100%{background:#00ff00;} }
#pantalla-evento-activo { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #ff0000; color: white; z-index: 100000; text-align: center; flex-direction: column; justify-content: center; align-items: center; }
#hora-evento-gigante { font-size: 8vh; margin: 0; }
#texto-evento-gigante { font-size: 10vh; margin: 20px; text-transform: uppercase; }
.instruccion { font-size: 4vh; background: #fff; color: #000; padding: 20px 50px; border-radius: 60px; font-weight: bold; animation: pulse 1s infinite; }
@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
</style>
</head>
<body>

<button id="btn-inicial" onclick="iniciarSistema()">PULSA AQUÍ PARA EMPEZAR</button>

<div id="barra">
    <div id="fecha">--</div>
    <div id="reloj">00:00</div>
</div>

<div id="pantalla-evento-activo" onclick="detenerAlarmaDirecto()">
    <div id="hora-evento-gigante"></div>
    <div id="texto-evento-gigante"></div>
    <div class="instruccion">TOCA PARA PARAR</div>
</div>

<div class="container" id="mainContainer">
    <div class="col col-hoy">
        <h1>ESTA MAÑANA / TARDE</h1>
        <button class="btn-repaso" onclick="repasarDia('hoy')">🔊 LEER TODO HOY</button>
        <div id="lista-hoy" class="lista-eventos"></div>
    </div>
    <div class="col col-manana">
        <h1>MAÑANA</h1>
        <button class="btn-repaso" onclick="repasarDia('manana')">🔊 LEER TODO MAÑANA</button>
        <div id="lista-manana" class="lista-eventos"></div>
    </div>
</div>

<!-- Campana muteada -->
<audio id="campana" src="campana.mp3"></audio>

<script>
const API_KEY = "AIzaSyDh0DjfE2qqaBeVfww5u84FLp4_elsF7Uc";
const CALENDAR_ID = "anacara1941@gmail.com";

let eventosHoy = [];
let eventosManana = [];
let idEventoActual = null;
let eventosSilenciados = new Set();
let avisosPrevios = new Set();
let vozSeleccionada = null;

function cargarVoces() {
    const voces = window.speechSynthesis.getVoices();
    vozSeleccionada = voces.find(v => v.lang.startsWith("es") && v.name.includes("Google")) || voces.find(v => v.lang.startsWith("es"));
}
window.speechSynthesis.onvoiceschanged = cargarVoces;

function numeroALetras(n) {
    const unidades = ['doce', 'una', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez', 'once'];
    return unidades[n % 12];
}

function actualizarReloj(){
    const ahora = new Date();
    document.getElementById("fecha").innerText = ahora.toLocaleDateString('es-ES', {weekday:'long', day:'numeric', month:'long'});
    let h = ahora.getHours();
    let m = ahora.getMinutes();
    document.getElementById("reloj").innerText = (h % 12 || 12) + ":" + (m < 10 ? "0" + m : m);
}

async function cargarCalendario(){
    const hoy = new Date();
    hoy.setHours(0,0,0,0);
    const tiempoMin = hoy.toISOString();
    
    const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events?key=${API_KEY}&timeMin=${tiempoMin}&singleEvents=true&orderBy=startTime`;

    try {
        const respuesta = await fetch(url);
        const datos = await respuesta.json();
        if (datos.items) {
            organizarEventos(datos.items);
        } else {
            console.error("No se recibieron eventos. Revisa la API Key.");
        }
    } catch (error) {
        console.error("Error de conexión:", error);
    }
}

function organizarEventos(items){
    const ahora = new Date();
    const hoyStr = ahora.toDateString();
    const manana = new Date();
    manana.setDate(ahora.getDate() + 1);
    const mananaStr = manana.toDateString();

    eventosHoy = [];
    eventosManana = [];

    items.forEach(item => {
        const fechaInicio = new Date(item.start.dateTime || item.start.date);
        const fechaStr = fechaInicio.toDateString();
        
        let h = fechaInicio.getHours();
        let m = fechaInicio.getMinutes();
        let franja = (h >= 6 && h < 14) ? "de la mañana" : (h >= 14 && h < 21) ? "de la tarde" : "de la noche";
        
        const ev = {
            id: item.id,
            titulo: (item.summary || "Algo pendiente").replace(/^\*+/, '').trim(),
            horaObjeto: fechaInicio,
            horaTexto: (h % 12 || 12) + ":" + (m < 10 ? "0" + m : m) + " " + franja,
            voz: `a las ${numeroALetras(h)} ${m === 0 ? 'en punto' : 'y ' + m} ${franja}`,
            asteriscos: (item.summary || "").match(/^\*+/)?.[0].length || 0
        };

        if (fechaStr === hoyStr) eventosHoy.push(ev);
        else if (fechaStr === mananaStr) eventosManana.push(ev);
    });
    renderizar();
}

function renderizar() {
    dibujarLista(eventosHoy, "lista-hoy", "hoy");
    dibujarLista(eventosManana, "lista-manana", "mañana");
}

function dibujarLista(lista, idContenedor, diaNombre) {
    const cont = document.getElementById(idContenedor);
    cont.innerHTML = "";
    const ahora = new Date();

    lista.forEach(ev => {
        const yaSilenciado = eventosSilenciados.has(ev.id);
        const diffMinutos = (ev.horaObjeto - ahora) / 60000;
        
        // Lógica de urgencia para eventos de HOY
        let esUrgente = false;
        if (idContenedor === "lista-hoy" && !yaSilenciado) {
            const estaEnHora = (ahora >= ev.horaObjeto && ahora <= new Date(ev.horaObjeto.getTime() + 3600000));
            const esPreaviso = (ev.asteriscos >= 2 && diffMinutos <= 60 && diffMinutos > 0);
            if (estaEnHora || esPreaviso) esUrgente = true;
        }

        const div = document.createElement("div");
        div.className = "evento" + (esUrgente ? " urgente" : "");
        div.innerHTML = `<h2>${ev.horaTexto}</h2><p>${ev.titulo}</p>`;
        
        div.onclick = () => hablar(`Mamá, ${diaNombre}, ${ev.voz} tienes ${ev.titulo}`);
        cont.appendChild(div);

        if (esUrgente && idEventoActual !== ev.id) {
            lanzarAlarma(ev);
        }
    });
}

function lanzarAlarma(ev) {
    idEventoActual = ev.id;
    document.getElementById("hora-evento-gigante").innerText = ev.horaTexto;
    document.getElementById("texto-evento-gigante").innerText = ev.titulo;
    document.getElementById("pantalla-evento-activo").style.display = "flex";
    
    // Campana muteada
    const campana = document.getElementById("campana");
    campana.volume = 0;
    
    bucleVoz(ev);
}

function bucleVoz(ev) {
    if (idEventoActual !== ev.id) return;
    window.speechSynthesis.cancel();
    const mensaje = new SpeechSynthesisUtterance(`Mamá, tienes ${ev.titulo} ${ev.voz}`);
    mensaje.volume = 1.0;
    if (vozSeleccionada) mensaje.voice = vozSeleccionada;
    mensaje.onend = () => {
        if (idEventoActual === ev.id) setTimeout(() => bucleVoz(ev), 2000);
    };
    window.speechSynthesis.speak(mensaje);
}

function detenerAlarmaDirecto() {
    eventosSilenciados.add(idEventoActual);
    idEventoActual = null;
    document.getElementById("pantalla-evento-activo").style.display = "none";
    window.speechSynthesis.cancel();
    renderizar();
}

function hablar(texto) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    u.volume = 1.0;
    if (vozSeleccionada) u.voice = vozSeleccionada;
    window.speechSynthesis.speak(u);
}

function iniciarSistema(){
    document.getElementById("btn-inicial").style.display = "none";
    document.getElementById("mainContainer").style.display = "flex";
    actualizarReloj();
    cargarVoces();
    cargarCalendario();
    setInterval(actualizarReloj, 1000);
    setInterval(cargarCalendario, 60000);
}

function repasarDia(dia) {
    const lista = (dia === 'hoy') ? eventosHoy : eventosManana;
    if (lista.length === 0) return hablar("No tienes nada anotado para " + dia);
    let resumen = `Mamá, para ${dia === 'hoy' ? 'hoy' : 'mañana'} tienes: `;
    lista.forEach(ev => resumen += `${ev.voz}, ${ev.titulo}. `);
    hablar(resumen);
}
</script>
</body>
</html>
